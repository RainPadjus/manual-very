<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Просто о вере</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='none' stroke='%231C1917' stroke-width='.75'/><circle cx='16' cy='16' r='9' fill='none' stroke='%231C1917' stroke-width='.75'/><circle cx='16' cy='16' r='4' fill='%231C1917'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function(){var t=localStorage.getItem('mv_theme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t);var fs=localStorage.getItem('mv_fontsize');if(fs)document.documentElement.style.setProperty('--fs-body',fs);var mw=localStorage.getItem('mv_width');if(mw)document.documentElement.style.setProperty('--cw',mw)})();
</script>
<style>
/* ═══ RESET ═══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--fb);color:var(--tx);background:var(--bg);line-height:1.75;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
::selection{background:var(--acbg2)}
.hidden{display:none!important}

/* ═══ VARIABLES ═══ */
:root{
  --fd:'Cormorant Garamond',Georgia,serif;
  --fb:'Source Serif 4',Georgia,serif;
  --fm:'JetBrains Mono',Consolas,monospace;
  --bg:#FAF9F6;--bgR:#FFFFFF;--bgI:#F3F0EA;--bgD:#EDEBE5;
  --tx:#1C1917;--tx2:#44403C;--tx3:#78716C;--tx4:#A8A29E;
  --ac:#B45309;--ac2:#92400E;
  --acbg:rgba(180,83,9,.06);--acbg2:rgba(180,83,9,.14);
  --bd:#E7E5E4;--bd2:#D6D3D1;
  --sh:0 1px 3px rgba(28,25,23,.06),0 1px 2px rgba(28,25,23,.04);
  --sh2:0 4px 16px rgba(28,25,23,.08),0 1px 3px rgba(28,25,23,.06);
  --sh3:0 20px 60px rgba(28,25,23,.12),0 4px 16px rgba(28,25,23,.08);
  --glass:rgba(250,249,246,.88);
  --fs-body:1.08rem;
  --hh:56px;--sw:320px;--cw:680px;--yw:580px;
  --ease:.3s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#100F0D;--bgR:#1A1815;--bgI:#151311;--bgD:#0B0A09;
  --tx:#E8E6E1;--tx2:#B8B4AE;--tx3:#7C7872;--tx4:#55514C;
  --ac:#D4943A;--ac2:#E8A94A;
  --acbg:rgba(212,148,58,.08);--acbg2:rgba(212,148,58,.18);
  --bd:#2A2724;--bd2:#3D3935;
  --sh:0 1px 3px rgba(0,0,0,.2),0 1px 2px rgba(0,0,0,.15);
  --sh2:0 4px 16px rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.2);
  --sh3:0 20px 60px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --glass:rgba(16,15,13,.88);
}

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--tx4)}

/* ═══ PROGRESS BAR ═══ */
#progressBar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--ac),var(--ac2));z-index:60;transition:width .15s linear;pointer-events:none;opacity:0;width:0}
#reader:not(.hidden) ~ #progressBar{opacity:1}

/* ═══ COVER ═══ */
#cover{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;background:var(--bg);position:relative;overflow:hidden}
#cover::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 42%,var(--acbg2) 0%,transparent 70%);pointer-events:none}
#cover::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");pointer-events:none;opacity:.5}

.cover-symbol{margin-bottom:3.5rem;position:relative;z-index:1;color:var(--tx)}
.cover-symbol svg{overflow:visible}
.cc{opacity:0}
.cc1,.cc2,.cc3{fill:none;stroke:currentColor}
.cc1{stroke-dasharray:478;stroke-dashoffset:478;animation:drawC 2s cubic-bezier(.25,.1,.25,1) .2s forwards}
.cc2{stroke-dasharray:314;stroke-dashoffset:314;animation:drawC 1.6s cubic-bezier(.25,.1,.25,1) .6s forwards}
.cc3{stroke-dasharray:151;stroke-dashoffset:151;animation:drawC 1.2s cubic-bezier(.25,.1,.25,1) 1s forwards}
.cc4{animation:fadeIn .6s ease 1.4s forwards}
@keyframes drawC{to{stroke-dashoffset:0;opacity:1}}

.cover-title{font-family:var(--fd);font-size:clamp(2.8rem,7vw,5rem);font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-bottom:.3em;opacity:0;animation:fadeUp .9s ease .8s forwards;position:relative;z-index:1}
.cover-sub{font-family:var(--fd);font-size:clamp(1rem,2.5vw,1.4rem);font-weight:400;font-style:italic;color:var(--tx3);margin-bottom:2em;opacity:0;animation:fadeUp .9s ease 1.1s forwards;position:relative;z-index:1}
.cover-btn{font-family:var(--fd);font-size:1.15rem;font-weight:500;letter-spacing:.08em;padding:.8em 2.8em;border:1.5px solid var(--tx);background:transparent;color:var(--tx);cursor:pointer;transition:all var(--ease);opacity:0;animation:fadeUp .8s ease 1.3s forwards;position:relative;z-index:1;text-transform:uppercase}
.cover-btn:hover{background:var(--tx);color:var(--bg);transform:translateY(-1px);box-shadow:var(--sh2)}
.cover-btn:active{transform:translateY(0);box-shadow:var(--sh)}
.cover-continue{display:block;margin-top:1.5rem;font-family:var(--fd);font-size:.95rem;color:var(--tx4);text-decoration:none;cursor:pointer;opacity:0;animation:fadeUp .8s ease 1.55s forwards;border:none;background:none;position:relative;z-index:1;transition:color var(--ease)}
.cover-continue:hover{color:var(--ac)}

/* ═══ HEADER ═══ */
#header{position:fixed;top:0;left:0;right:0;height:var(--hh);display:flex;align-items:center;padding:0 1rem;background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid var(--bd);z-index:50;gap:.5rem}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;border-radius:8px;transition:all var(--ease);color:var(--tx3);flex-shrink:0}
.icon-btn:hover{background:var(--acbg);color:var(--ac)}
.icon-btn svg{width:18px;height:18px}
.hdr-title{font-family:var(--fd);font-size:.9rem;font-weight:600;color:var(--tx4);letter-spacing:.02em;white-space:nowrap}
.hdr-sep{color:var(--bd2);margin:0 .15rem;font-size:.75rem}
.hdr-chapter{font-family:var(--fd);font-size:.9rem;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.hdr-right{display:flex;align-items:center;gap:2px;margin-left:auto;flex-shrink:0}
.hdr-dots{display:flex;gap:5px;align-items:center;margin-right:.5rem}
.hdr-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--tx4);transition:all var(--ease)}
.hdr-dot.filled{background:var(--ac);border-color:var(--ac)}

/* ═══ SIDEBAR ═══ */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .35s;z-index:90;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#overlay.vis{opacity:1;pointer-events:auto}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:var(--bg);border-right:1px solid var(--bd);overflow-y:auto;transform:translateX(-100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:100;padding:1.5rem 0;overscroll-behavior:contain}
#sidebar.open{transform:translateX(0)}
.sb-header{padding:0 1.5rem 1rem;font-family:var(--fd);font-size:1.15rem;font-weight:600;border-bottom:1px solid var(--bd);margin-bottom:.5rem;display:flex;align-items:center;justify-content:space-between}
.sb-close{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;border-radius:6px;color:var(--tx4);transition:all var(--ease)}
.sb-close:hover{background:var(--acbg);color:var(--ac)}
.sb-close svg{width:14px;height:14px}
.sb-item{display:flex;align-items:center;padding:.55rem 1.5rem;cursor:pointer;transition:all .2s ease;gap:.75rem;border-left:3px solid transparent;position:relative}
.sb-item:hover{background:var(--acbg)}
.sb-item.active{background:var(--acbg);border-left-color:var(--ac)}
.sb-num{font-family:var(--fm);font-size:.72rem;color:var(--tx4);width:1.75rem;text-align:right;flex-shrink:0}
.sb-label{font-family:var(--fb);font-size:.88rem;color:var(--tx);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-dots{display:flex;gap:3px;flex-shrink:0}
.sb-dot{width:5px;height:5px;border-radius:50%;border:1px solid var(--bd2);transition:all var(--ease)}
.sb-dot.read{background:var(--ac);border-color:var(--ac)}
.sb-part{padding:.85rem 1.5rem .35rem;font-family:var(--fm);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx4);margin-top:.25rem}
.sb-special .sb-num{visibility:hidden}
.sb-app{padding-left:2.2rem!important;font-size:.82rem;opacity:.85}.sb-app:hover{opacity:1}.sb-app .sb-num{visibility:hidden}

/* ═══ SEARCH MODAL ═══ */
#searchModal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:min(18vh,150px)}
#searchModal.hidden{display:none!important}
.search-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .2s ease}
.search-dialog{position:relative;width:min(560px,92vw);background:var(--bgR);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh3);overflow:hidden;animation:modalIn .25s cubic-bezier(.4,0,.2,1)}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.search-hdr{display:flex;align-items:center;padding:0 1.15rem;gap:.65rem;border-bottom:1px solid var(--bd)}
.search-hdr svg{width:18px;height:18px;color:var(--tx4);flex-shrink:0}
.search-hdr input{flex:1;height:52px;border:none;background:none;font-family:var(--fb);font-size:1rem;color:var(--tx);outline:none}
.search-hdr input::placeholder{color:var(--tx4)}
.search-hdr kbd{display:inline-block;padding:.15em .45em;background:var(--bgI);border:1px solid var(--bd);border-radius:4px;font-family:var(--fm);font-size:.6rem;color:var(--tx4);flex-shrink:0}
.search-results{max-height:min(380px,48vh);overflow-y:auto;padding:.5rem}
.search-empty{text-align:center;padding:2.5rem 1rem;color:var(--tx4);font-family:var(--fb);font-size:.92rem}
.search-result{display:block;padding:.6rem 1rem;border-radius:10px;cursor:pointer;transition:background .15s}
.search-result:hover,.search-result.active{background:var(--acbg)}
.search-result-title{font-family:var(--fm);font-size:.68rem;color:var(--tx4);letter-spacing:.03em;margin-bottom:.15rem}
.search-result-excerpt{font-family:var(--fb);font-size:.88rem;color:var(--tx2);line-height:1.55}
.search-result-excerpt mark{background:var(--acbg2);color:var(--ac);border-radius:2px;padding:0 2px}
.search-foot{display:flex;gap:1.5rem;justify-content:center;padding:.6rem;border-top:1px solid var(--bd);font-family:var(--fm);font-size:.6rem;color:var(--tx4)}
.search-foot kbd{display:inline-block;padding:.1em .3em;background:var(--bgI);border:1px solid var(--bd);border-radius:3px;font-family:var(--fm);font-size:.58rem;margin:0 .15em}

/* ═══ READING AREA ═══ */
main{padding-top:var(--hh)}
.reading{max-width:var(--cw);margin:0 auto;padding:2.5rem 1.5rem 4rem}
.ch-num{font-family:var(--fm);font-size:.75rem;color:var(--tx4);letter-spacing:.14em;text-transform:uppercase;margin-bottom:.5rem}
.ch-title{font-family:var(--fd);font-size:clamp(2rem,4.5vw,3rem);font-weight:600;line-height:1.15;letter-spacing:-.025em;margin-bottom:.25rem}

/* ═══ CONTENT ═══ */
.content{transition:opacity .25s ease,transform .25s ease}
.content.fading{opacity:0;transform:translateY(8px)}
.content h2{font-family:var(--fd);font-size:1.65rem;font-weight:600;margin:2.75rem 0 1rem;letter-spacing:-.01em;color:var(--tx)}
.content h3{font-family:var(--fd);font-size:1.35rem;font-weight:600;margin:2.25rem 0 .75rem;letter-spacing:-.01em}
.content h4{font-family:var(--fd);font-size:1.15rem;font-weight:600;margin:1.75rem 0 .6rem}
.content p{margin-bottom:1.25em;font-size:var(--fs-body,1.08rem);line-height:1.8}
.content ul,.content ol{margin:1em 0 1.5em;padding-left:1.75em}
.content ol{list-style:decimal}
.content li{margin-bottom:.5em;line-height:1.65;font-size:var(--fs-body,1.08rem)}
.content li::marker{color:var(--tx4)}
.content strong{font-weight:600;color:var(--tx)}
.content em{font-style:italic}

/* Blockquotes */
.content blockquote{margin:2rem 0;padding:1.15rem 1.5rem 1.15rem 1.75rem;border-left:2.5px solid var(--ac);background:linear-gradient(135deg,var(--acbg) 0%,transparent 80%);border-radius:0 10px 10px 0;position:relative}
.content blockquote::before{content:'\201C';position:absolute;top:-.1rem;left:.65rem;font-family:var(--fd);font-size:3.5rem;color:var(--ac);opacity:.15;line-height:1;pointer-events:none}
.content blockquote p{margin-bottom:0;font-style:italic;color:var(--tx2);font-size:1.02rem;line-height:1.75}

/* Tables */
.table-wrap{overflow-x:auto;margin:1.5rem 0 2rem;border-radius:10px;border:1px solid var(--bd);box-shadow:var(--sh)}
.content table{width:100%;border-collapse:collapse;font-size:.9rem;line-height:1.5}
.content th{font-family:var(--fm);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:.65rem .85rem;background:var(--bgD);color:var(--tx3);border-bottom:1px solid var(--bd);white-space:nowrap}
.content td{padding:.55rem .85rem;border-bottom:1px solid var(--bd);vertical-align:top}
.content tr:last-child td{border-bottom:none}
.content tr:hover td{background:var(--acbg)}

/* First paragraph drop cap */
.content>p:first-child::first-letter,.content>h2+p::first-letter,.content>h3+p::first-letter{font-family:var(--fd);font-size:3em;float:left;line-height:.82;margin-right:.06em;margin-top:.08em;font-weight:600;color:var(--ac)}

/* Depth-specific */
.tier-0 .content{max-width:var(--yw);margin:0 auto}
.tier-0 .content p{font-size:var(--fs-body,1.08rem);line-height:1.88}
.tier-0 .content li{font-size:var(--fs-body,1.08rem)}

/* ═══ DIVE DEEPER ═══ */
.dive{text-align:center;margin:3rem 0 1rem;opacity:0;animation:fadeUp .5s ease .15s forwards}
.dive button{font-family:var(--fd);font-size:1rem;color:var(--tx4);background:none;border:none;cursor:pointer;padding:.75rem 1.5rem;transition:all var(--ease);letter-spacing:.02em;display:inline-flex;align-items:center;gap:.5rem;border-radius:8px}
.dive button:hover{color:var(--ac);background:var(--acbg)}
.dive-arrow{display:inline-block;transition:transform .3s}
.dive button:hover .dive-arrow{transform:translateY(3px)}

/* ═══ CHAPTER NAV ═══ */
.ch-nav{display:flex;justify-content:space-between;padding:2.5rem 0;margin-top:2rem;border-top:1px solid var(--bd);gap:1rem}
.nav-btn{display:flex;flex-direction:column;align-items:flex-start;padding:.85rem 1.15rem;border:1px solid var(--bd);border-radius:10px;background:none;cursor:pointer;transition:all var(--ease);font-family:var(--fb);max-width:48%;text-align:left}
.nav-btn:hover{border-color:var(--ac);background:var(--acbg);transform:translateY(-1px);box-shadow:var(--sh)}
.nav-btn.next{align-items:flex-end;text-align:right;margin-left:auto}
.nav-dir{font-family:var(--fm);font-size:.62rem;color:var(--tx4);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3rem}
.nav-label{font-size:.88rem;color:var(--tx);line-height:1.3}
.nav-btn:empty{visibility:hidden}

/* ═══ BACK TO TOP ═══ */
#btt{position:fixed;bottom:2rem;right:2rem;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:40;opacity:0;transform:translateY(12px);pointer-events:none;transition:all var(--ease);box-shadow:var(--sh)}
#btt.vis{opacity:1;transform:translateY(0);pointer-events:auto}
#btt:hover{color:var(--ac);border-color:var(--ac);transform:translateY(-2px);box-shadow:var(--sh2)}
#btt svg{width:18px;height:18px}

/* ═══ FOOTER ═══ */
.book-footer{text-align:center;padding:3rem 1.5rem 2rem;color:var(--tx4);font-family:var(--fm);font-size:.68rem;letter-spacing:.02em;line-height:1.8;border-top:1px solid var(--bd);margin-top:2rem}
.book-footer kbd{display:inline-block;padding:.1em .4em;background:var(--bgI);border:1px solid var(--bd);border-radius:3px;font-family:var(--fm);font-size:.62rem;margin:0 .15em}

/* ═══ ANIMATIONS ═══ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes contentIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.content-enter{animation:contentIn .45s ease forwards}

/* ═══ ILLUSTRATIONS ═══ */
.ch-illust{margin:1.5rem -12.5% 2.5rem;width:125%;max-width:calc(100vw - 2rem);position:relative;overflow:hidden;border-radius:6px;box-shadow:var(--sh2)}
.ch-illust img{width:100%;display:block;opacity:.92;transition:opacity .3s ease}
.ch-illust img:hover{opacity:1}
.ch-illust figcaption{position:absolute;bottom:0;left:0;right:0;padding:.55rem 1rem;background:linear-gradient(transparent,rgba(0,0,0,.65));color:rgba(255,255,255,.85);font-family:var(--fd);font-style:italic;font-size:.82rem;letter-spacing:.02em}
[data-theme="dark"] .ch-illust img{opacity:.82}
[data-theme="dark"] .ch-illust img:hover{opacity:.95}
[data-theme="dark"] .ch-illust figcaption{background:linear-gradient(transparent,rgba(0,0,0,.8))}

/* ═══ КАРТА: минуты, графика, красная нить ═══ */
.minute{margin:2.2rem 0;padding:1.15rem 1.35rem 1.1rem;border:1px solid var(--bd);border-left:2px solid var(--ac);border-radius:6px;background:var(--bgI)}
.minute .minute-tag{display:block;font-family:var(--fm);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tx4);margin-bottom:.55rem}
.minute p{font-size:.92em;line-height:1.75;color:var(--tx2);margin:0}
.minute .ch-illust{margin:1.1rem 0 .2rem;width:100%;max-width:100%}
.graphic{margin:2.6rem auto;text-align:center}
.graphic svg{width:100%;height:auto;color:var(--tx2)}
.graphic figcaption{font-family:var(--fd);font-style:italic;font-size:.85rem;color:var(--tx4);margin-top:.8rem;line-height:1.6}
.g-timeline svg{max-width:33rem}
.g-ring svg{max-width:25rem}
.g-week svg{max-width:36rem}
.ch-illust.artifact{margin:1.6rem auto 2.5rem;width:100%;max-width:30rem}
.thread{display:flex;align-items:center;gap:.55rem;font-family:var(--fm);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#b3312e;margin:.2rem 0 .65rem}
.thread i{display:inline-block;width:2.2rem;height:0;border-top:1px solid #b3312e;position:relative}
.thread i::after{content:'';position:absolute;right:-3px;top:-3.5px;width:6px;height:6px;border-radius:50%;background:#b3312e}
a.ext{color:var(--ac);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.ch-illust.artifact{box-shadow:none;overflow:visible}
.ch-illust.artifact img{border-radius:4px;box-shadow:var(--sh2)}
.ch-illust.artifact figcaption{position:static;background:none;color:var(--tx4);font-family:var(--fd);font-style:italic;font-size:.8rem;padding:.55rem .2rem 0;text-align:center}
[data-theme="dark"] .ch-illust.artifact figcaption{background:none;color:var(--tx4)}

/* ═══ EPIGRAPHS ═══ */
.ch-epigraph{margin:2rem auto 2.5rem;max-width:34rem;padding:0 1.5rem;text-align:center;opacity:0;animation:fadeUp .6s ease .2s forwards}
.ch-epigraph::before{content:'';display:block;width:2.5rem;height:1px;background:var(--ac);opacity:.35;margin:0 auto 1.2rem}
.ch-epigraph .eq{font-family:var(--fd);font-style:italic;font-size:1.18rem;line-height:1.75;color:var(--tx3)}
.ch-epigraph .ea{font-family:var(--fm);font-size:.75rem;color:var(--tx4);margin-top:.85rem;letter-spacing:.08em}
[data-theme="dark"] .ch-epigraph .eq{color:var(--tx2)}

/* ═══ AUDIO PLAYER ═══ */
.audio-wrap{max-width:34rem;margin:0 auto 2rem;padding:0 1.5rem;opacity:0;animation:fadeUp .6s ease .3s forwards}
.audio-toggle{display:flex;align-items:center;gap:.5rem;background:none;border:1px solid var(--bd);border-radius:2rem;padding:.45rem 1.1rem .45rem .85rem;font-family:var(--fm);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);cursor:pointer;transition:all .3s ease;margin:0 auto}
.audio-toggle:hover{border-color:var(--ac);color:var(--ac)}
.audio-toggle svg{width:14px;height:14px;flex-shrink:0}
.audio-toggle.playing{border-color:var(--ac);color:var(--ac);background:var(--acbg)}
.audio-box{display:none;margin-top:.75rem;padding:.75rem 1rem;border-radius:12px;background:var(--bgI);border:1px solid var(--bd)}
.audio-box.open{display:block;animation:fadeUp .3s ease forwards}
.audio-bar-wrap{display:flex;align-items:center;gap:.5rem}
.audio-play{background:none;border:none;cursor:pointer;color:var(--ac);padding:2px;display:flex;align-items:center;transition:transform .15s ease;flex-shrink:0}
.audio-play:hover{transform:scale(1.12)}
.audio-play svg{width:20px;height:20px}
.audio-skip{background:none;border:none;cursor:pointer;color:var(--tx3);padding:2px;display:flex;align-items:center;transition:all .15s ease;flex-shrink:0;position:relative}
.audio-skip:hover{color:var(--ac)}
.audio-skip svg{width:16px;height:16px}
.audio-skip-label{font-family:var(--fm);font-size:.42rem;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;font-weight:500}
.audio-track{flex:1;height:20px;cursor:pointer;position:relative;display:flex;align-items:center}
.audio-track-bar{width:100%;height:4px;background:var(--bd2);border-radius:2px;position:relative;overflow:hidden}
.audio-fill{height:100%;background:var(--ac);border-radius:2px;width:0;transition:width .1s linear}
.audio-track-thumb{width:12px;height:12px;background:var(--ac);border-radius:50%;position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .1s linear;box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:0;left:0}
.audio-track:hover .audio-track-thumb{opacity:1}
.audio-time{font-family:var(--fm);font-size:.58rem;color:var(--tx4);letter-spacing:.03em;min-width:7ch;text-align:right;flex-shrink:0}
.audio-speed{background:none;border:1px solid var(--bd);border-radius:4px;font-family:var(--fm);font-size:.55rem;color:var(--tx3);padding:1px 5px;cursor:pointer;transition:all .2s ease;letter-spacing:.02em;flex-shrink:0}
.audio-speed:hover{border-color:var(--ac);color:var(--ac)}
[data-theme="dark"] .audio-box{background:var(--bgI)}

/* ═══ SETTINGS PANEL ═══ */
#settingsPanel{position:fixed;top:var(--hh);right:0;width:min(320px,90vw);background:var(--bgR);border:1px solid var(--bd);border-top:none;border-radius:0 0 0 12px;box-shadow:var(--sh3);z-index:55;padding:1.25rem 1.5rem;transform:translateY(-110%);opacity:0;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .25s ease;pointer-events:none}
#settingsPanel.open{transform:translateY(0);opacity:1;pointer-events:auto}
.settings-title{font-family:var(--fm);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx4);margin-bottom:1rem}
.settings-row{margin-bottom:1.15rem}
.settings-label{font-family:var(--fb);font-size:.85rem;color:var(--tx2);margin-bottom:.5rem}
.settings-opts{display:flex;gap:4px;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--bgI);padding:2px}
.settings-opt{flex:1;text-align:center;font-family:var(--fm);font-size:.62rem;letter-spacing:.04em;padding:.45rem .5rem;border:none;background:transparent;color:var(--tx3);cursor:pointer;border-radius:6px;transition:all .2s ease}
.settings-opt:hover{color:var(--tx)}
.settings-opt.active{background:var(--tx);color:var(--bg)}
[data-theme="dark"] .settings-opt.active{background:var(--ac);color:var(--bgD)}

/* ═══ COVER PROGRESS ═══ */
.cover-progress{position:relative;z-index:1;margin-top:2rem;opacity:0;animation:fadeUp .8s ease 2s forwards;text-align:center}
.cover-progress-text{font-family:var(--fm);font-size:.68rem;color:var(--tx4);letter-spacing:.03em;margin-bottom:.5rem}
.cover-progress-bar{width:min(200px,50vw);height:3px;background:var(--bd);border-radius:2px;margin:0 auto;overflow:hidden}
.cover-progress-fill{height:100%;background:var(--ac);border-radius:2px;transition:width .5s ease}

/* ═══ SIDEBAR PROGRESS FOOTER ═══ */
.sb-progress{padding:1rem 1.5rem;margin-top:.5rem;border-top:1px solid var(--bd)}
.sb-progress-text{font-family:var(--fm);font-size:.62rem;color:var(--tx4);letter-spacing:.03em;margin-bottom:.4rem}
.sb-progress-bar{width:100%;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.sb-progress-fill{height:100%;background:var(--ac);border-radius:2px;transition:width .3s ease}

/* ═══ THEME TRANSITION ═══ */
.tt,.tt *,.tt *::before,.tt *::after{transition:background-color .4s ease,color .3s ease,border-color .3s ease,box-shadow .3s ease,fill .3s ease,stroke .3s ease!important}

/* ═══ RESPONSIVE ═══ */
@media(max-width:768px){
  :root{--sw:85vw;--cw:100%}
  .reading{padding:2rem 1.15rem 3rem}
  .content p{font-size:var(--fs-body,1.02rem)}
  .tier-0 .content p{font-size:var(--fs-body,1.02rem)}
  .ch-nav{flex-direction:column}

  .content>p:first-child::first-letter,.content>h2+p::first-letter,.content>h3+p::first-letter{font-size:2.5em}
  .content th,.content td{padding:.45rem .6rem;font-size:.85rem}
  .book-footer kbd{display:none}
  .ch-epigraph{max-width:100%;padding:0 .5rem;margin:1.5rem auto 2rem}
  .ch-epigraph .eq{font-size:1.08rem}
  .ch-illust{margin:1.5rem 0 2rem;width:100%;border-radius:4px}
  #btt{bottom:1.25rem;right:1.25rem;width:38px;height:38px}
  .hdr-title{display:none}
  .hdr-sep{display:none}
  .search-foot{display:none}
}
@media(max-width:400px){
}
@media print{

}

<script>
const B={"chapters":[{"num":1,"short":"Библиотека","title":"Библиотека","yadro":"","obzor":"","polnaya":"<p>Впервые я вошёл в храм один, без знакомого, который мог бы шепнуть, когда креститься и куда смотреть. Внутри было прохладнее, чем на улице, пахло воском и старым деревом. Где-то впереди человек в облачении читал, и за ним отвечали другие голоса. Слова текли мерно, с паузами, будто у них был свой ход времени. Я слышал отдельные знакомые корни, но не понимал почти ничего. Смысл не складывался в фразы: он проходил мимо меня, как река за стеной.</p>\n<p>Я смотрел на людей вокруг. Они знали, когда встать, когда поклониться, когда тихо ответить. Пожилая женщина держала маленькую книжку, не заглядывая в неё; мальчик рядом с ней клевал носом; у входа кто-то осторожно прикрыл дверь, чтобы не впустить холод. Я стоял среди этого движения, как человек, вошедший в разговор в самом конце и не знающий ни языка, ни имён собеседников. Церковь казалась не закрытой, а просто уже давно начавшейся.</p>\n<p>Я помню и свою первую попытку открыть Библию с первой страницы. Мне казалось, что так честнее: идти от начала к концу, ничего не пропуская. Сначала были сад, река, первые люди, потом имена, странствия, законы, жертвы, ещё имена. Через некоторое время я перестал понимать, кто кому приходится и почему вдруг начались подробные размеры какого-то сооружения. Я закрыл книгу с чувством, что, вероятно, просто недостаточно умён для неё. Позже понял: я пытался пройти незнакомую страну без карты и сердился на страну за то, что она не похожа на мой двор.</p>\n<h2 id=\"под-одной-обложкой\">Под одной обложкой</h2>\n<p>Эти страницы и есть попытка нарисовать такую карту. Ты, возможно, никогда не читал Библию, знаешь о ней отдельные сцены из кино, праздников и шуток, но не видишь всей линии. Здесь мы пройдём её целиком: от начала мира до последнего видения, от первых обещаний до того, как христианская история выходит за пределы одной земли. Любой пересказ беднее самого текста. В нём исчезают интонации, тишина между событиями, странные повороты, лица второстепенных людей. Но без общего очертания легко заблудиться ещё до первой развилки. Карта не заменяет территорию, зато помогает понять, где ты находишься и в какую сторону повернуть, когда в руки попадёт сама книга.</p><figure class=\"graphic g-map\"><svg viewBox=\"0 0 760 540\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Карта: дорога всей Книги от сада до города\"><path d=\"M0,158 C70,150 130,168 185,182 C245,196 300,168 335,162 C372,156 408,175 422,215 C438,262 440,310 432,362 C424,416 380,428 320,432 C250,437 190,455 120,470 L0,486 Z\" fill=\"var(--acbg)\" opacity=\".85\"/><path d=\"M0,158 C70,150 130,168 185,182 C245,196 300,168 335,162 C372,156 408,175 422,215 C438,262 440,310 432,362 C424,416 380,428 320,432 C250,437 190,455 120,470\" fill=\"none\" stroke=\"currentColor\" stroke-width=\".8\" opacity=\".5\"/><ellipse cx=\"352\" cy=\"252\" rx=\"20\" ry=\"8\" fill=\"var(--bg)\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".7\" transform=\"rotate(-18 352 252)\"/><text x=\"352\" y=\"256\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">Кипр</text><text x=\"150\" y=\"330\" font-size=\"11\" fill=\"var(--tx4)\" style=\"font-family:var(--fd);font-style:italic\" opacity=\".8\" transform=\"rotate(-20 150 330)\">Средиземное море</text><path d=\"M700,120 C685,190 690,250 685,305\" fill=\"none\" stroke=\"currentColor\" stroke-width=\".8\" opacity=\".4\"/><path d=\"M600,95 C592,120 588,148 585,168 C610,205 635,228 645,248\" fill=\"none\" stroke=\"currentColor\" stroke-width=\".8\" opacity=\".4\"/><path d=\"M262,530 C268,495 262,455 258,432\" fill=\"none\" stroke=\"currentColor\" stroke-width=\".8\" opacity=\".4\"/><path d=\"M685,305 Q649,225 585,168 Q513,227 468,262 Q376,332 255,425 Q309,454 390,458 Q435,365 452,295 Q535,284 645,248 Q587,262 500,300 Q467,272 462,220 Q471,246 452,295 Q474,246 524,172 Q426,144 300,140 Q184,141 95,118 Q142,132 160,170 Q193,201 253,208\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-dasharray=\"1 6\" stroke-linecap=\"round\" opacity=\".9\"/><path d=\"M255,425 Q330,370 452,295 Q400,150 300,60 Q250,25 215,-10\" fill=\"none\" stroke=\"#b3312e\" stroke-width=\"1.1\" opacity=\".85\"/><text x=\"236\" y=\"34\" font-size=\"9.5\" fill=\"#b3312e\" style=\"font-family:var(--fm)\" transform=\"rotate(-38 236 34)\">к Городу-саду</text><circle cx=\"685\" cy=\"305\" r=\"3.2\" fill=\"currentColor\"/><text x=\"693\" y=\"319\" font-size=\"12\" fill=\"var(--tx)\" style=\"font-family:var(--fd)\">Ур</text><circle cx=\"585\" cy=\"168\" r=\"3.2\" fill=\"currentColor\"/><text x=\"593\" y=\"162\" font-size=\"12\" fill=\"var(--tx)\" style=\"font-family:var(--fd)\">Харран</text><circle cx=\"468\" cy=\"262\" r=\"3.2\" fill=\"currentColor\"/><text x=\"478\" y=\"254\" font-size=\"12\" fill=\"var(--tx)\" style=\"font-family:var(--fd)\">Ханаан</text><circle cx=\"255\" cy=\"425\" r=\"3.2\" fill=\"currentColor\"/><text x=\"247\" y=\"443\" font-size=\"12\" fill=\"var(--tx)\" style=\"font-family:var(--fd)\" text-anchor=\"end\">Египет</text><circle cx=\"390\" cy=\"458\" r=\"3.2\" fill=\"currentColor\"/><text x=\"400\" y=\"472\" font-size=\"12\" fill=\"var(--tx)\" style=\"font-family:var(--fd)\">Синай</text><circle cx=\"645\" cy=\"248\" r=\"3.2\" fill=\"currentColor\"/><text x=\"655\" y=\"252\" font-size=\"12\" fill=\"var(--tx)\" style=\"font-family:var(--fd)\">Вавилон</text><circle cx=\"462\" cy=\"220\" r=\"3.2\" fill=\"currentColor\"/><text x=\"472\" y=\"216\" font-size=\"12\" fill=\"var(--tx)\" style=\"font-family:var(--fd)\">Назарет</text><circle cx=\"524\" cy=\"172\" r=\"3.2\" fill=\"currentColor\"/><text x=\"534\" y=\"168\" font-size=\"12\" fill=\"var(--tx)\" style=\"font-family:var(--fd)\">Дамаск</text><circle cx=\"95\" cy=\"118\" r=\"3.2\" fill=\"currentColor\"/><text x=\"95\" y=\"108\" font-size=\"12\" fill=\"var(--tx)\" style=\"font-family:var(--fd)\" text-anchor=\"middle\">Рим</text><circle cx=\"253\" cy=\"208\" r=\"3.2\" fill=\"currentColor\"/><text x=\"253\" y=\"228\" font-size=\"12\" fill=\"var(--tx)\" style=\"font-family:var(--fd)\" text-anchor=\"middle\">Патмос</text><g stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><line x1=\"452\" y1=\"287\" x2=\"452\" y2=\"301\"/><line x1=\"447\" y1=\"292\" x2=\"457\" y2=\"292\"/></g><text x=\"463\" y=\"303\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fd);font-weight:600\">Иерусалим</text><g transform=\"translate(688,78)\" stroke=\"currentColor\" fill=\"none\" opacity=\".85\"><circle r=\"26\" stroke-width=\".7\"/><circle r=\"16\" stroke-width=\".7\"/><circle r=\"3\" fill=\"currentColor\" stroke=\"none\"/><line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-34\" stroke-width=\"1.2\"/><text x=\"0\" y=\"-40\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--tx3)\" stroke=\"none\" style=\"font-family:var(--fm)\">С</text></g><g transform=\"translate(560,492)\"><rect x=\"-14\" y=\"-20\" width=\"212\" height=\"40\" fill=\"var(--bg)\" stroke=\"currentColor\" stroke-width=\".8\" opacity=\".95\"/><text x=\"92\" y=\"-2\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--tx)\" style=\"font-family:var(--fm)\" letter-spacing=\".18em\">ДОРОГА ВСЕЙ КНИГИ</text><text x=\"92\" y=\"13\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--tx4)\" style=\"font-family:var(--fd);font-style:italic\">от сада до города</text></g></svg><figcaption>Дорога всей Книги — маршрут этой карты</figcaption></figure>\n<p>В прологе я говорил о компасе, который ищет полюс за горизонтом. Библия похожа на длинное путешествие по местности, где стрелка всё время возвращается к одному северу, хотя дорога петляет, уходит в пустыню и иногда кажется оборванной. Я не буду заранее доказывать, что этот север существует. В этой части книги мы сначала посмотрим, как устроен рассказ и куда он ведёт. Я сам когда-то подходил к нему с подозрением и до сих пор не считаю честным просить тебя верить мне на слово. Но читать карту стоит так, будто за её линиями может оказаться настоящая земля.</p>\n<p>Я буду держаться здесь простого правила: сначала дать событиям прозвучать, потом осторожно назвать их смысл. Если начать сразу с объяснений, люди превращаются в фигурки, а дорога — в схему. Авраам перестаёт быть стариком, который выходит из привычной земли; Моисей — человеком, который спорит и боится; Мария — девушкой, слышащей невозможное в обычной комнате. Мне важно, чтобы ты встретил их живыми, даже если пока не знаешь, что с ними произойдёт.</p>\n<p>При этом карта не будет притворяться полной. Она не вместит каждую ветвь родословной, каждую песню и каждый спор. Я оставлю за пределами линии то, что понадобится только при подробном чтении, и буду говорить простыми словами там, где термины скорее заслоняют смысл. Вопросы, которые требуют проверки свидетельств и аргументов, ждут своих глав дальше. Здесь достаточно увидеть направление: кто зовёт, кого зовут, откуда люди уходят и к чему возвращаются.</p>\n<p>Начнём с предмета, который можно поставить на стол. Библия под одной обложкой выглядит как книга, но физически это собрание разных книг. Они написаны в разное время, для разных людей и по разным поводам, хотя христианская традиция читает их вместе. Внутри две большие части — Ветхий Завет и Новый Завет. Слово «завет» здесь означает союз, договор Бога с людьми. Речь не о соглашении равных сторон с мелким шрифтом внизу страницы. Бог вступает в историю, обещает, зовёт, устанавливает отношения; люди отвечают верностью или отступлением, и на этом движении строится весь рассказ.</p>\n<p>Ветхий Завет христиане получили вместе с иудеями. Если считать книги способом, привычным для христианского издания, в еврейском каноне тридцать девять книг; в православной Библии рядом с ними находятся ещё около десятка книг, которые называют неканоническими. Ветхий Завет — не пролог, который можно быстро пролистать перед «главной частью». В нём появляются творение, разлом человеческой жизни, Авраам, обещание народу, закон, храм, цари, изгнание и надежда. Без него невозможно понять ни слова Иисуса о Царстве, ни разговоры апостолов, ни язык молитвы, которым наполнен Новый Завет.</p>\n<p>Новый Завет состоит из двадцати семи книг. Четыре Евангелия рассказывают о жизни, смерти и воскресении Иисуса Христа; Деяния продолжают историю Его учеников; двадцать одно письмо обращено к общинам и отдельным людям; Откровение завершает книгу видением конца и нового творения. Это разные голоса и разные формы разговора, но они стоят в одной библиотеке. Евангелие не отменяет рассказ о древнем народе, письмо не заменяет повествование, а последнее видение не отрывается от первой страницы. Каждая часть подсвечивает соседнюю.</p>\n<aside class=\"minute\"><span class=\"minute-tag\">минута в сторону</span><p>Первой крупной печатной книгой Европы стала именно эта библиотека: латинская Библия Гутенберга, Майнц, около 1455 года. Сегодня полная Библия существует примерно на семистах семидесяти языках, Новый Завет — почти на тысяче восьмистах, и счёт растёт каждый год. По охвату у этой книги нет соперников — что бы читатель ни думал о её содержании.</p></aside>\n<p>У этой библиотеки есть и языковая история. Большая часть Ветхого Завета написана на еврейском языке, отдельные места — на арамейском; Новый Завет дошёл до нас на греческом. Поэтому между древним событием и тем, что ты видишь в русском издании, лежит работа переводчиков, переписчиков и читателей многих поколений. Это не делает текст недоступным, но объясняет, почему в нём встречаются слова, чьи оттенки нельзя восстановить одним взглядом в словаре. Язык здесь не прозрачное стекло: иногда он даёт увидеть дальше, а иногда оставляет на поверхности след старого времени.</p>\n<aside class=\"minute\"><span class=\"minute-tag\">минута в сторону</span><p>В 1947 году бедуинский пастух у Мёртвого моря бросил камень в тёмную пещеру и услышал звон разбитого кувшина. Внутри лежали свитки, и среди них — полная книга Исайи, переписанная во втором веке до нашей эры: на тысячу лет старше всех известных тогда еврейских рукописей Библии. Когда кумранский свиток сравнили с привычным текстом, совпадение оказалось почти дословным. Тысяча лет переписывания от руки — а текст держится.</p><figure class=\"ch-illust artifact\"><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/The%20Great%20Isaiah%20Scroll%20MS%20A%20(1QIsa)%20-%20Google%20Art%20Project.jpg?width=1200\" alt=\"Великий свиток Исайи из Кумрана, II век до нашей эры\" loading=\"lazy\"><figcaption>Великий свиток Исайи из Кумрана, II век до нашей эры</figcaption></figure></aside>\n<p>У библиотеки есть ещё одна особенность: её книги не лежат в порядке человеческой жизни одного героя. На соседних полках могут встретиться история царя, песня человека в беде и письмо, написанное маленькой общине, которая боялась распасться. Если перескакивать без ориентиров, кажется, что текст меняет тему без причины. Но причина часто скрыта в общей дороге. Плач отвечает на войну, мудрость учится жить после поражения, письмо пытается сохранить надежду там, где её легко потерять. Даже тишина между двумя книгами иногда оказывается частью движения.</p>\n<p>Мне помогает читать Библию как разговор, который начался до моего рождения. У него есть старшие голоса, резкие реплики, долгие паузы и места, где собеседник будто бы не отвечает. Я могу не соглашаться, спотыкаться о жестокие сцены, откладывать непонятный образ, возвращаться к странице через год. Но если вырвать один голос из разговора и заставить его отвечать за всю библиотеку, получится карикатура. Общая карта нужна именно затем, чтобы отдельное место не стало целым континентом.</p>\n<h2 id=\"полки-и-время\">Полки и время</h2>\n<p>Если представить Библию библиотекой, на её полках стоят книги разных жанров. Повествование ведёт через события и судьбы людей; закон формулирует заповеди и порядок жизни; поэзия говорит ритмом молитвы, песни и мудрости; пророчество обращается к современникам, обличает, утешает и открывает будущее; письма отвечают на конкретные трудности общин; апокалиптика рисует видения, где образы сгущаются до символов. Читать всё одинаково нельзя: от рассказа ждёшь движения событий, от псалма — голоса сердца, от пророческого текста — вызова, от письма — мысли, адресованной кому-то. Жанр задаёт не готовый ответ, но правильную дистанцию. Глубже к этому мы вернёмся в главе «Библия и Причастие».</p><figure class=\"graphic g-shelf\"><svg viewBox=\"0 0 740 262\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Все книги Библии как корешки на полке\"><text x=\"20\" y=\"18\" font-size=\"11\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\" letter-spacing=\".14em\">ВЕТХИЙ ЗАВЕТ — 39 КНИГ</text><g><title>Быт — 50 гл.</title><rect x=\"20.0\" y=\"28\" width=\"34.6\" height=\"88\" rx=\"1.5\" fill=\"currentColor\" opacity=\"0.85\" stroke=\"var(--bg)\" stroke-width=\".6\"/><text x=\"37.3\" y=\"109\" transform=\"rotate(-90 37.3 109)\" font-size=\"9.5\" fill=\"var(--bg)\" style=\"font-family:var(--fm)\" letter-spacing=\".05em\">Быт</text></g><g><title>Исх — 40 гл.</title><rect x=\"56.1\" y=\"32\" width=\"27.7\" height=\"84\" rx=\"1.5\" fill=\"currentColor\" opacity=\"0.85\" stroke=\"var(--bg)\" stroke-width=\".6\"/><text x=\"69.9\" y=\"109\" transform=\"rotate(-90 69.9 109)\" font-size=\"9.5\" fill=\"var(--bg)\" style=\"font-family:var(--fm)\" letter-spacing=\".05em\">Исх</text></g><g><title>Лев — 27 гл.</title><rect x=\"85.3\" y=\"36\" width=\"18.7\" height=\"80\" rx=\"1.5\" fill=\"currentColor\" opacity=\"0.85\" stroke=\"var(--bg)\" stroke-width=\".6\"/><text x=\"94.6\" y=\"109\" transform=\"rotate(-90 94.6 109)\" font-size=\"9.5\" fill=\"var(--bg)\" style=\"font-family:var(--fm)\" letter-spacing=\".05em\">Лев</text></g><g><title>Чис — 36 гл.</title><rect x=\"105.5\" y=\"28\" width=\"24.9\" height=\"88\" rx=\"1.5\" fill=\"currentColor\" opacity=\"0.85\" stroke=\"var(--bg)\" stroke-width=\".6\"/><text x=\"117.9\" y=\"109\" transform=\"rotate(-90 117.9 109)\" font-size=\"9.5\"
