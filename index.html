 научили думать и спорить. Католицизм дал великую институцию и интеллектуальную дисциплину. Православие сохранило то, что другие ветви местами сузили: обожение — спасение не как юридическое оправдание, а как исцеление и преображение природы; апофатику — трезвое знание, что Бог больше любого нашего знания о Нём; литургию — красоту как путь к истине, обращённую не к одному рассудку, а ко всему человеку; аскетику — семнадцать веков практического опыта преображения; и Предание — живую память, в которой Писание читается там, где помнят, зачем оно написано. Для того, кто искал не тезис, а жизнь, это весит.</p>\n<p>Но выбрать — не значит всё понять заранее. Это значит перестать стоять на обочине и войти внутрь, чтобы проверить изнутри то, что снаружи не проверяется: стоя на берегу и изучая учебник по плаванию, не узнаешь, каково плавать. И вот что можно сделать — не завтра, сегодня, маленькими шагами, ничего не подписывая на всю жизнь. Прийти на литургию — не туристом, а человеком, который допускает, что это может быть правдой, и дать красоте сделать своё раньше, чем ты всё поймёшь. Прочитать Евангелие от Марка, шестнадцать глав, за вечер — не как памятник литературы, а как письмо тебе. Попробовать самую простую молитву: если Ты есть, дай знать, — не требуя грома и допуская, что ответ придёт не так, как ждёшь. Найти одного верующего, которого уважаешь, и задать ему свой самый трудный вопрос. Это первый шаг, а не весь путь; но с него перестаёшь парить и встаёшь на землю.</p>\n<p>Я начал эту книгу ночью и заканчиваю ночью. Полюс я тебе так и не показал — и предупреждал в самом начале, что не стану лгать об этом; доказать его из этой комнаты нельзя. Но за двадцать глав стрелка перестала указывать в пустоту: там, куда она смотрит, обнаружились начало, у которого был первый миг, порядок, подогнанный под жизнь, нравственный закон тяжелее любой выгоды, сознание, которое шире физики, пустой гроб, о котором спорили, но тела так и не предъявили, и Лицо, ради которого всё это писалось. Честертон сказал, что христианский идеал не испробовали и отвергли — его сочли трудным и оставили без попытки. Книга дала тебе доводы. Жизнь даст проверку. Ещё Паскаль сказал: в мире достаточно света для того, кто хочет видеть. Ты дочитал до конца. Вопрос теперь не в том, довольно ли света. Вопрос в том, хочешь ли ты видеть.</p>\n<p>Решай.</p>"}],"preface":"<p>Я начал писать эту книгу ночью, и, наверное, честнее всего читать её тоже ночью — когда дела кончились, а сна нет. Днём вопрос о Боге легко отложить: слишком много задач, слишком много света. Он возвращается в темноте, когда никто не смотрит и не надо держать лицо. Не как богословская проблема — как что-то ближе к телу. Тупая пустота под рёбрами, у которой нет имени и нет причины, потому что снаружи вроде бы всё в порядке.</p>\n<p>С этой пустоты всё и началось. Я помню вечер, когда закрыл ноутбук после очередного спора в сети — из тех, где обе стороны одинаково уверены и одинаково пусты, — и поймал себя на неудобной мысли: я бойко отвергаю христианство, но ни разу всерьёз в него не заглядывал. Знал пересказ, знал насмешку, знал десяток готовых возражений. А самого предмета не знал. Это было похоже на рецензию на непрочитанную книгу. Вопрос, который тогда встал, был простой и неудобный: можно ли, оставаясь честным человеком, всерьёз принять христианство? Не на уровне бабушкиной традиции и крашеных яиц, не на уровне «все религии по-своему хороши» — а на уровне фактов, логики и той самой ночной пустоты. Так, чтобы на этом можно было стоять.</p>\n<p>Я решил разобраться сам. Собрать всё, что можно найти, — философию, науку, историю, самые сильные возражения, — и посмотреть, что выдержит, а что рассыплется в руках. Инструментом был в том числе искусственный интеллект: он хорош, чтобы собрать аргументы, свести источники, найти формулировку, которую сам не поймаешь. Но чтобы меня не поняли неверно: думать за меня он не мог, а решать за тебя не будет. Источники и выводы я проверял сам; там, где он подсовывал красивую цитату без адреса, она вылетала. Книга писалась для себя. Если она окажется полезной ещё кому-то — тем лучше; но я не ставил задачи кого-то обратить и не собираюсь начинать сейчас.</p>\n<p>Правила были простые, и я старался их не нарушать. Если вопрос открытый — так и сказано: открытый. Если аргумент слабый — назван слабым, даже когда он играет за мою сторону. Возражению даётся полный голос, прежде чем ему отвечают: Достоевский, Ницше, Хитченс, Докинз, Камю говорят здесь в полную силу, а не в карикатуре, которую удобно опровергать. И там, где ответа у меня нет, я пишу, что его нет, и не заклеиваю дыру красивой фразой. Скептик прощает вере многое. Одного он не прощает — когда его держат за дурака. Я слишком долго сам был этим скептиком, чтобы так поступить с тобой.</p>\n<p>Ещё одно, и это важнее правил. Я быстро понял, что спор о Боге в конце концов упирается не в данные, а в то, с какой меркой мы к данным подходим. Речь о том, насколько заранее ты считаешь чудо возможным. Если ты держишь его вероятность в точности за ноль, никакое свидетельство тебя не сдвинет — на ноль сколько ни умножай, выйдет ноль; но это уже не вывод из фактов, а условие, с которым ты к фактам пришёл. Если ты держишь её очень малой — а у трезвого скептика на это есть причины: повторяемость обычного опыта, долгая история разоблачённых «чудес», привычка науки искать естественное объяснение, — тогда ты потребуешь очень сильных свидетельств. Это законно. Я прошу лишь заметить, где проходит граница: одно дело — взвешивать свидетельства, другое — назначить приговор до того, как их увидел. Первое — честный скепсис. Второе — вера навыворот, которая тоже держится не на доказательстве. Держи эту мерку в поле зрения — свою и чужую, — и дальше можно спорить честно.</p>\n<p>Устроена книга просто: она идёт по одной линии — от вопроса «кто такой Бог?» до вопроса «что ты со всем этим сделаешь?». Сначала мы проверим, не пустота ли то, что зовёт нас в темноте. Потом — что в нас самих сломано и почему больно. Потом — что с этим сделал Бог, если Он есть. Потом — как это выглядит не как идея, а как понедельник утром. И наконец — горизонт и решение, потому что книгу можно закрыть, а вопрос закрыть нельзя.</p>\n<p>Но прежде чем идти по этой линии, я разложил карту. Если ты никогда не открывал Библию — или открывал и увяз на второй странице, — сразу за прологом тебя ждёт отдельная часть: вся её история, от первого сада до последнего города, пересказанная простыми словами, и само сердце учения. Я писал её так, чтобы хватило человеку, у которого нет под рукой ни Библии, ни того, кому можно задать вопрос. А тот, кто эту историю знает, может пройти карту быстрым шагом и вернуться на линию: она никуда не денется.</p>\n<p>Читать это подряд не обязательно. Можно начать с того, что болит прямо сейчас: с одиночества, со страха смерти, со стыда за то, чего не можешь в себе одолеть. Боль — плохой советчик, но честный проводник; она обычно точнее знает, где твой настоящий вопрос, чем оглавление.</p>\n<p>Я не обещаю, что к последней странице ты во что-то уверуешь. Это не в моей власти и, честно говоря, не в твоей тоже — вера не выжимается усилием, как и любовь. Я обещаю другое: что не буду тебе льстить, не буду тобой манипулировать и не сделаю вид, будто у меня всё сходится, когда не сходится. Взамен прошу немного — читать так, будто это может оказаться правдой. Не «верить авансом», а просто не захлопывать дверь до того, как заглянул. Стоя на берегу, не узнаешь, каково плавать.</p>\n<p>За окном всё та же ночь, с которой мы начали. Стрелка компаса крутится и не находит севера, потому что полюс — за горизонтом, дальше, чем видно из этой комнаты. Но то, что его не видно, ещё не значит, что его нет.</p>\n<p>Итак — начнём. Тихо, без спешки. Спешить нам всё равно некуда: до утра ещё далеко.</p>","appendices":"<h2 id=\"app-shagi\">Приложение I. Первые шаги</h2><p>Книга кончается словом «Решай». Это приложение — для того, кто решил хотя бы посмотреть. Здесь нет ни одного аргумента: только практика — куда идти, что делать руками и чего не бояться. Всё ниже описывает обычную практику православных приходов; детали в разных храмах отличаются, и спросить на месте — всегда правильный ход.</p>\n<h3 id=\"как-выбрать-приход\">Как выбрать приход</h3>\n<p>Ближайший к дому чаще оказывается лучшим: в церковной жизни регулярность важнее «идеальности». Приди на воскресную литургию — она обычно начинается утром, между восемью и десятью; расписание висит на дверях храма или на его странице в интернете. Смотри на живое: отвечают ли на вопросы за свечной лавкой по-человечески, есть ли в приходе беседы для взрослых, занятия, люди разных возрастов. Если после двух-трёх воскресений чувствуешь только холод — попробуй соседний храм; это не измена, а поиск своего места. Об одежде: скромно — и достаточно. Женщине в большинстве городских приходов платок желателен, но никто не выгонит без него; мужчина снимает головной убор у входа.</p>\n<h3 id=\"что-происходит-на-литургии\">Что происходит на литургии</h3>\n<p>Главная служба недели — Божественная литургия. У неё две части: сначала — слово, потом — Чаша. Если знать её скелет, стоять становится не страшно:</p>\n<ul>\n<li>Начало: возгласы священника и ектеньи — общие молитвы «списком нужд», на каждую хор отвечает «Господи, помилуй».</li>\n<li>Антифоны — поются псалмы; затем малый вход: из алтаря выносят Евангелие.</li>\n<li>Чтения: сначала Апостол (отрывок из посланий), затем Евангелие — в этот момент все стоят особенно тихо.</li>\n<li>Проповедь — здесь или в самом конце службы.</li>\n<li>Херувимская песнь и великий вход: хлеб и вино торжественно переносят на престол.</li>\n<li>«Верую» — Символ веры, его поёт или читает весь храм вместе.</li>\n<li>Евхаристический канон — сердце службы: благодарение и освящение Даров. Это те самые слова Тайной вечери, которые ты читал на Карте.</li>\n<li>«Отче наш» — вслух, все вместе.</li>\n<li>Причащение; в конце — целование креста, и можно взять антидор (кусочек благословлённого хлеба).</li>\n</ul>\n<p>Длится всё около полутора-двух часов. Устал стоять — сядь на лавку у стены: это не грех и не неуважение, лавки для того и стоят. Никто не проверяет тебя на «своего»; ходить, смотреть и молчать — законный способ присутствовать. Единственное, чего не стоит делать с ходу, — подходить к Чаше: к причастию приступают крещёные и подготовленные. Сначала — разговор со священником.</p>\n<h3 id=\"можно-ли-просто-прийти\">Можно ли просто прийти</h3>\n<p>Да. Некрещёный человек может приходить на службы, стоять от начала до конца, ставить свечи, молиться своими словами — для этого не нужно ничьё разрешение. Исторически часть службы называлась «литургией оглашенных» — она и была открыта для готовящихся и интересующихся. Если захочешь подать записку с именами о здравии — в записках обычно поминают крещёных; как быть с твоими близкими, подскажут в лавке.</p>\n<h3 id=\"разговор-со-священником\">Разговор со священником</h3>\n<p>Самый простой вход: после службы подойти и сказать как есть — «я с нуля, читаю, хочу разобраться, с кем можно поговорить?» Либо спросить за свечной лавкой, когда священник принимает. Не бойся занять его время: такие разговоры — его прямое дело, и вопрос честного новичка для священника — радость, а не помеха. В больших приходах есть огласительные беседы или катехизаторские курсы — цикл встреч для взрослых, где можно спрашивать всё; спроси, есть ли такие.</p>\n<h3 id=\"первая-исповедь\">Первая исповедь</h3>\n<p>Практически это выглядит так: исповедь бывает вечером накануне литургии или утром до неё; ты подходишь к аналою, где стоит священник. Скажи сразу, что исповедуешься впервые, — тогда он поможет вопросами и ничего не будет требовать. Говори не «по списку всех правил», а то, что действительно жжёт; священник здесь свидетель твоего разговора с Богом, а не судья и не следователь. Тайна исповеди абсолютна. Не жди особого чувства и «облегчения по расписанию»: как говорила глава «Покаяние», важен разворот, а не переживание. И если от волнения забудешь всё, что хотел сказать, — это случается со всеми.</p>\n<h3 id=\"крещение-взрослого\">Крещение взрослого</h3>\n<p>Взрослых перед крещением готовят: в большинстве приходов это огласительные беседы — от нескольких встреч до курса длиной в месяцы, и это благо, а не бюрократия: у тебя будет место, где можно задать все вопросы. Крёстные взрослому не обязательны. О деньгах: таинства не продаются; в храмах обычно указывают рекомендуемое пожертвование, и если средств нет — об этом можно прямо сказать. Если где-то из крещения делают платную услугу с прейскурантом и без подготовки — это повод поискать другой приход, а не повод разочароваться в Церкви.</p>\n<h3 id=\"календарь-в-который-ты-врежешься\">Календарь, в который ты врежешься</h3>\n<p>Церковный год держится на Пасхе — она переходящая, весной, и от неё отсчитывается многое. Вокруг — двенадцать больших праздников (Рождество, Крещение, Преображение, Успение и другие) и четыре многодневных поста: Великий — семь недель перед Пасхой, Рождественский — сорок дней, и два коротких летних. Постятся также в среду и пятницу. Новичку важно знать две вещи. Первая: пост — не про еду в первую очередь, а про внимание и свободу от автоматизмов; еда — только инструмент. Вторая: в пост не въезжают с разбега — мера обсуждается со священником и зависит от здоровья, обстоятельств и опыта. Никто не ждёт от человека с нуля монашеской строгости; ждут честного шага по силам. А каждое воскресенье — маленькая Пасха: поэтому в воскресенье не постятся так строго и поэтому главная служба — именно воскресная.</p>\n<h3 id=\"иконы-почему-целуют-доску\">Иконы: почему целуют доску</h3>\n<p>Первый культурный шок новичка: люди целуют доски и кланяются им. Ответ Церковь выстрадала в настоящей войне — иконоборческих спорах восьмого века — и сформулировала на Седьмом Вселенском соборе (787 год): честь, воздаваемая образу, восходит к первообразу. Целуют не доску и не краску, а Того и тех, кто на ней, — как целуют фотографию родного человека, нисколько не путая её с ним самим. Икона — не идол и не магический предмет, а окно; возможным его сделало то самое событие, вокруг которого вся эта книга: Бог стал видимым человеком, и потому Его можно изображать. Свеча перед иконой — маленькая жертва и молитва телом, для тех минут, когда слов нет.</p>\n<h3 id=\"первые-три-месяца\">Первые три месяца</h3>\n<p>Если совсем просто, план такой: ходи на литургию по воскресеньям — просто стой и слушай, со скелетом службы из этого приложения; прочитай Евангелие от Марка (один вечер — а как читать дальше, сказано на Карте и в главе «Библия и Причастие»); найди священника или зрелого верующего для вопросов; и говори короткую честную молитву из главы «Решение»: если Ты есть — дай знать. Три месяца такого ритма скажут тебе о христианстве больше, чем ещё десять прочитанных книг.</p><h2 id=\"app-polka\">Приложение II. Что читать дальше</h2><p>Эта книга — карта и первый разговор. Ниже — полка для следующего года: проверенные книги, каждая со своей задачей. Порядок не случаен: список выстроен как маршрут, сверху вниз.</p>\n<ul>\n<li><strong>Евангелие от Марка</strong> — не «после всех», а первым. Один вечер, шестнадцать глав. Всё остальное в этом списке — комментарий к нему.</li>\n<li><strong>Клайв Стейплз Льюис, «Просто христианство»</strong> — самое известное введение в веру, написанное бывшим атеистом: трезвый разговор о нравственном законе, о том, кем был Христос, и о том, как это меняет обычную жизнь.</li>\n<li><strong>Клайв Стейплз Льюис, «Письма Баламута»</strong> — та же вера с изнанки: переписка старого беса с племянником о том, как незаметно развалить человеку душу. Смешно, страшно и узнаваемо до неприличия.</li>\n<li><strong>Гилберт Кит Честертон, «Ортодоксия»</strong> — история о том, как остроумнейший журналист Англии искал новую философию и обнаружил, что её уже две тысячи лет как построили. Книга-фейерверк: парадоксы, от которых вера перестаёт казаться пресной.</li>\n<li><strong>Августин, «Исповедь»</strong> — первая в мире автобиография: молитва длиной в книгу, украденные груши (ты помнишь их по главе «Грехопадение») и самая знаменитая фраза о беспокойном сердце. Шестнадцать веков — а читается как дневник современника.</li>\n<li><strong>Митрополит Антоний Сурожский, «Учитесь молиться»</strong> — маленькая книга врача, ставшего епископом: как разговаривать с Богом, когда не умеешь, не чувствуешь и не уверен, что Он слушает. Продолжение главы «Молитва».</li>\n<li><strong>Александр Шмеман, «За жизнь мира»</strong> — о том, почему христианство — не «религиозный сектор жизни», а сама жизнь: еда, время, любовь и смерть, увиденные через Евхаристию. Продолжение главы «Библия и Причастие».</li>\n<li><strong>Каллист Уэр, «Православная церковь»</strong> — спокойный и честный обзор: история, устройство, вера. Лучший справочник для того, кто хочет понять, куда именно он пришёл.</li>\n<li><strong>Архимандрит Тихон (Шевкунов), «Несвятые святые»</strong> — рассказы о живых людях Церкви: монахах, чудаках и святых без глянца. Книга, которая показывает ту самую общину из главы «Церковь» в лицах.</li>\n<li><strong>Фёдор Достоевский, «Братья Карамазовы»</strong> — роман, из которого выросла глава «Страдание»: бунт Ивана, тишина Алёши, старец Зосима. Самый серьёзный спор о Боге в мировой литературе — изнутри веры.</li>\n<li><strong>Блез Паскаль, «Мысли»</strong> — записки гения науки о величии и нищете человека, оборванные смертью. Читать медленно, по фрагменту; это книга-собеседник на годы.</li>\n<li><strong>Клайв Стейплз Льюис, «Расторжение брака»</strong> — короткая повесть об автобусной экскурсии из ада в рай: о том, что двери ада заперты изнутри. Продолжение разговора из главы «Смерть».</li>\n</ul>\n<p>Как читать Библию целиком — уже сказано в этой книге: маршрут первого чтения на Карте, в главе «Сердце», а как жить с текстом — в главе «Библия и Причастие». Дублировать не буду; напомню лишь порядок: Марк → Лука → Бытие и Исход → по псалму в день → письма Павла целиком.</p>\n<h3 id=\"досье-бог-выбирает-негодных\">Досье: Бог выбирает негодных</h3>\n<p>Рефрен этой книги, собранный в одном месте. Если тебе кажется, что твоя биография — препятствие, посмотри на послужной список тех, через кого прошла вся эта история.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Кто</th><th>Кем был</th><th>Кем стал</th></tr></thead><tbody><tr><td>Моисей</td><td>убийца в бегах, заика</td><td>вывел народ из рабства, получил Закон</td></tr><tr><td>Раав</td><td>блудница из Иерихона</td><td>спасла разведчиков, вошла в родословие Мессии</td></tr><tr><td>Давид</td><td>младший сын, о котором забыли; позже — прелюбодей</td><td>царь и поэт, «муж по сердцу Бога»</td></tr><tr><td>Иона</td><td>пророк, сбежавший от поручения</td><td>привёл к покаянию целую столицу</td></tr><tr><td>Пётр</td><td>рыбак, трижды отрёкшийся в ночь ареста</td><td>камень, на котором строится община</td></tr><tr><td>Мария Магдалина</td><td>женщина, из которой изгнали семь бесов</td><td>первая свидетельница Воскресения</td></tr><tr><td>Павел</td><td>гонитель, одобривший первое убийство христианина</td><td>апостол, написавший половину Нового Завета</td></tr></tbody></table></div>\n<p>Список можно продолжать почти любым именем из этой книги — Августин с его грушами и пятнадцатью годами чужой женщины, Достоевский с эшафотом и каторгой, Бонхёффер с петлёй в конце. Закономерность одна, и она — лучшая новость для читателя с любой биографией: Бог пишет прямо по кривым строчкам. Твоя строчка не исключение.</p>","investigation":"","parts":[{"label":"0","title":"Карта","chapters":[0,1,2,3,4,5,6]},{"label":"I","title":"Ночь","chapters":[7,8,9,10,11]},{"label":"II","title":"Разлом","chapters":[12,13,14,15]},{"label":"III","title":"Ответ","chapters":[16,17,18,19,20,21]},{"label":"IV","title":"Жизнь","chapters":[22,23,24,25,26,27]},{"label":"V","title":"Горизонт","chapters":[28,29]}],"shorts":["Библиотека","Сад","Исход","Цари и пророки","Иисус из Назарета","Дорога в Рим","Сердце","Три часа ночи","Почему есть нечто","Сознание","Кто такой Бог","Собеседники"       this._audioUpdateUI();
      if(!this._audio.paused){
        document.getElementById('audioPlayBtn').innerHTML='<svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>';
      }
    }
  },
  toggleAudioBox(){
    var box=document.getElementById('audioBox');
    if(box.classList.contains('open')){box.classList.remove('open');return}
    box.classList.add('open');
    var sec=this.s.sec;
    var depth=this.s.depth;
    var aDir=depth===2?'audio/polnaya/':'audio/yadro/';
    if(!this._audio||this._audioSec!==sec||this._audioDepth!==depth){
      if(this._audio){this._audio.pause();this._audio=null}
      var a=new Audio(aDir+AUDIO_FILES[sec]+'.mp3');
      this._audio=a;this._audioSec=sec;this._audioDepth=depth;this._speedIdx=0;
      var self=this;
      a.addEventListener('timeupdate',function(){self._audioUpdateUI()});
      a.addEventListener('ended',function(){
        document.getElementById('audioToggle').classList.remove('playing');
        document.getElementById('audioPlayBtn').innerHTML='<svg viewBox="0 0 20 20" fill="currentColor"><polygon points="5,3 17,10 5,17"/></svg>';
      });
    }
  },
  audioToggle(){
    if(!this._audio)return;
    if(this._audio.paused){
      this._audio.play();
      document.getElementById('audioToggle').classList.add('playing');
      document.getElementById('audioPlayBtn').innerHTML='<svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>';
    }else{
      this._audio.pause();
      document.getElementById('audioToggle').classList.remove('playing');
      document.getElementById('audioPlayBtn').innerHTML='<svg viewBox="0 0 20 20" fill="currentColor"><polygon points="5,3 17,10 5,17"/></svg>';
    }
  },
  audioSkip(sec){
    if(!this._audio)return;
    this._audio.currentTime=Math.max(0,Math.min(this._audio.duration,this._audio.currentTime+sec));
  },
  audioSeek(e){
    if(!this._audio||!this._audio.duration)return;
    var t=document.getElementById('audioTrack');
    var r=t.getBoundingClientRect();
    var pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    this._audio.currentTime=pct*this._audio.duration;
  },
  audioCycleSpeed(){
    if(!this._audio)return;
    this._speedIdx=(this._speedIdx+1)%this._speeds.length;
    this._audio.playbackRate=this._speeds[this._speedIdx];
    document.getElementById('audioSpeedBtn').textContent=this._speeds[this._speedIdx]+'x';
  },
  _audioUpdateUI(){
    if(!this._audio||!this._audio.duration)return;
    var pct=(this._audio.currentTime/this._audio.duration)*100;
    var el=document.getElementById('audioFill');
    if(el)el.style.width=pct+'%';
    var thumb=document.getElementById('audioThumb');
    if(thumb)thumb.style.left=pct+'%';
    var cur=this._audio.currentTime;
    var dur=this._audio.duration;
    var cm=Math.floor(cur/60),cs=Math.floor(cur%60);
    var dm=Math.floor(dur/60),ds=Math.floor(dur%60);
    var te=document.getElementById('audioTimeEl');
    if(te)te.textContent=cm+':'+(cs<10?'0':'')+cs+' / '+dm+':'+(ds<10?'0':'')+ds;
  },

  renderIllust(sec){
    var ill=this.ILLUST[sec];
    if(!ill)return '';
    return '<figure class="ch-illust"><img src="'+ill.src+'" alt="'+ill.cap+'" loading="lazy"><figcaption>'+ill.cap+'</figcaption></figure>';
  },

  renderEpigraph(sec){
    var ep=this.EPIGRAPHS[sec];
    if(!ep)return '';
    var list=Array.isArray(ep)?ep:[ep];
    var html='';
    list.forEach(function(e){
      var att=e.a;
      if(e.s)att+=', '+e.s;
      html+='<div class="ch-epigraph"><div class="eq">'+e.t+'</div><div class="ea">'+att+'</div></div>';
    });
    return html;
  },

  renderContent(){
    var sec=this.s.sec,depth=this.s.depth;var el=document.getElementById('content');
    var ill=sec>=0&&sec<NC?this.renderIllust(sec):'';
    var epi=sec!==NC?this.renderEpigraph(sec):'';
    if(sec===-2)el.innerHTML=epi+B.investigation;
    else if(sec===-1)el.innerHTML=epi+B.preface;
    else if(sec===NC)el.innerHTML=B.appendices;
    else{var ch=B.chapters[sec];el.innerHTML=ill+epi+ch.polnaya}
  },

  renderDive(){
    document.getElementById('diveWrap').innerHTML='';
  },

  chName(i){return (i<KN?'Карта '+(i+1):'Глава '+(i-KN+1))+'. '+B.shorts[i]},
  renderNav(){
    var sec=this.s.sec;var el=document.getElementById('chNav');
    var prev='',next='';
    if(sec>-2){var ps=sec-1;var pl=ps===-2?'Разбор':ps===-1?'Предисловие':app.chName(ps);
      if(ps>=-2)prev='<button class="nav-btn" onclick="app.go('+ps+')"><span class="nav-dir">\u2190 \u041D\u0430\u0437\u0430\u0434</span><span class="nav-label">'+pl+'</span></button>'}
    if(sec<NC){var ns=sec+1;var nl=ns===-1?'Предисловие':ns===NC?'Приложения':ns>=0?app.chName(ns):'Предисловие';
      if(ns<=NC)next='<button class="nav-btn next" onclick="app.go('+ns+')"><span class="nav-dir">\u0414\u0430\u043B\u0435\u0435 \u2192</span><span class="nav-label">'+nl+'</span></button>'}
    el.innerHTML=prev+next;
  },

  /* ── Sidebar ── */
  buildSb(){
    var el=document.getElementById('sbList');var h='';
    if(B.investigation){
      h+='<div class="sb-bonus">\u0414\u043E\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u043E</div>';
      h+='<div class="sb-item sb-special" data-s="-2" onclick="app.goSb(-2)"><span class="sb-num"></span><span class="sb-label">\u0420\u0430\u0437\u0431\u043E\u0440 \u0430\u0440\u0433\u0443\u043C\u0435\u043D\u0442\u043E\u0432</span><div class="sb-dots"><span class="sb-dot"></span></div></div>';
    }
    h+='<div class="sb-item sb-special" data-s="-1" onclick="app.goSb(-1)"><span class="sb-num"></span><span class="sb-label">\u041F\u0440\u0435\u0434\u0438\u0441\u043B\u043E\u0432\u0438\u0435</span><div class="sb-dots"><span class="sb-dot"></span></div></div>';
    B.parts.forEach(function(part,pi){
      h+='<div class="sb-part">'+(part.label||'')+'. '+part.title+'</div>';
      part.chapters.forEach(function(ci){
        h+='<div class="sb-item" data-s="'+ci+'" onclick="app.goSb('+ci+')"><span class="sb-num">'+(ci<KN?'К'+(ci+1):(ci-KN+1).toString().padStart(2,'0'))+'</span><span class="sb-label">'+B.shorts[ci]+'</span><div class="sb-dots"><span class="sb-dot"></span></div></div>';
      });
    });
    h+='<div class="sb-part">Приложения</div>';
    h+='<div class="sb-item" data-s="'+NC+'" onclick="app.goSb('+NC+')"><span class="sb-num">I</span><span class="sb-label">Первые шаги</span><div class="sb-dots"><span class="sb-dot"></span></div></div>';
    h+='<div class="sb-item" data-s="app2" onclick="app.goApp(\'app-polka\')"><span class="sb-num">II</span><span class="sb-label">Что читать дальше</span><div class="sb-dots"><span class="sb-dot"></span></div></div>';
    el.innerHTML=h;
    this.updateSbDots();
  },

  goSb(sec){this.closeSidebar();var self=this;setTimeout(function(){self.go(sec)},250)},
  goApp(id){this.closeSidebar();var self=this;setTimeout(function(){self.go(NC);if(history.replaceState)history.replaceState(null,'','#'+id);setTimeout(function(){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},350)},250)},

  updateSbActive(){
    var sec=this.s.sec;
    document.querySelectorAll('.sb-item').forEach(function(el){
      el.classList.toggle('active',parseInt(el.dataset.s)===sec);
    });
  },

  updateSbDots(){
    var prog=this.s.prog;
    document.querySelectorAll('.sb-item').forEach(function(el){
      var s=parseInt(el.dataset.s);
      var p=prog[s];
      if(s===-1||s===NC){
        var dot=el.querySelector('.sb-dot');
        if(dot)dot.classList.toggle('read',p!==undefined);
      }else{
        el.querySelectorAll('.sb-dot').forEach(function(dot,i){
          dot.classList.toggle('read',p!==undefined&&p>=i);
        });
      }
    });
  },

  toggleSidebar(){this.s.sbOpen?this.closeSidebar():this.openSidebar()},
  openSidebar(){
    this.s.sbOpen=true;
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('vis');
    /* Scroll active into view */
    var active=document.querySelector('.sb-item.active');
    if(active)setTimeout(function(){active.scrollIntoView({block:'center',behavior:'smooth'})},100);
  },
  closeSidebar(){this.s.sbOpen=false;document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('vis')},

  /* ── Progress ── */
  markRead(sec,depth){
    var k=sec;
    if(this.s.prog[k]===undefined||this.s.prog[k]<depth)this.s.prog[k]=depth;
    this.saveProg();
    this.updateSbDots();
    this.updateSbProgress();
  },
  loadProg(){try{this.s.prog=JSON.parse(localStorage.getItem('mv3_prog')||'{}')}catch(e){this.s.prog={}}},
  saveProg(){localStorage.setItem('mv3_prog',JSON.stringify(this.s.prog))},

  /* ── Cover & Sidebar Progress ── */
  updateCoverProgress(){
    var prog=this.s.prog;
    var done=0;
    for(var i=0;i<NC;i++){if(prog[i]!==undefined&&prog[i]>=2)done++}
    var cp=document.getElementById('coverProgress');
    if(!cp)return;
    if(done>0||Object.keys(prog).length>0){
      var read=0;for(var j=0;j<NC;j++){if(prog[j]!==undefined)read++}
      cp.classList.remove('hidden');
      document.getElementById('coverProgressText').textContent='Прочитано: '+read+' из '+NC+' глав';
      document.getElementById('coverProgressFill').style.width=(read/NC*100)+'%';
    }else{cp.classList.add('hidden')}
  },
  updateSbProgress(){
    var prog=this.s.prog;
    var done=0;
    for(var i=0;i<NC;i++){if(prog[i]!==undefined&&prog[i]>=2)done++}
    var el=document.getElementById('sbProgressText');
    if(el){
      el.textContent='Прогресс: '+done+'/'+NC;
      document.getElementById('sbProgressFill').style.width=(done/NC*100)+'%';
    }
  },

  updateProgress(){
    var bar=document.getElementById('progressBar');
    if(!bar)return;
    var h=document.documentElement.scrollHeight-window.innerHeight;
    if(h<=0){bar.style.width='0';return}
    bar.style.width=Math.min(100,window.scrollY/h*100)+'%';
  },

  /* ── Search ── */
  buildIndex(){
    this.idx=[];
    var self=this;
    if(B.investigation)this.idx.push({s:-2,d:-1,t:'\u0420\u0430\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u043D\u0438\u0435',x:self.strip(B.investigation)});
    this.idx.push({s:-1,d:-1,t:'\u041F\u0440\u0435\u0434\u0438\u0441\u043B\u043E\u0432\u0438\u0435',x:self.strip(B.preface)});
    B.chapters.forEach(function(ch,i){
      if(ch.polnaya)self.idx.push({s:i,d:0,t:'\u0413\u043B\u0430\u0432\u0430 '+(i+1)+'. '+ch.short,x:self.strip(ch.polnaya)});
    });
    if(B.appendices)this.idx.push({s:NC,d:-1,t:'\u041F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F',x:self.strip(B.appendices)});
  },
  strip(html){return html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').toLowerCase()},

  openSearch(){
    document.getElementById('searchModal').classList.remove('hidden');
    var inp=document.getElementById('searchInput');
    inp.value='';
    inp.focus();
    document.getElementById('searchResults').innerHTML='<div class="search-empty">\u041D\u0430\u0447\u043D\u0438\u0442\u0435 \u0432\u0432\u043E\u0434\u0438\u0442\u044C \u0434\u043B\u044F \u043F\u043E\u0438\u0441\u043A\u0430</div>';
    this.searchActive=-1;
  },
  closeSearch(){document.getElementById('searchModal').classList.add('hidden')},

  doSearch(q){
    if(!q||q.length<2){
      document.getElementById('searchResults').innerHTML='<div class="search-empty">\u041D\u0430\u0447\u043D\u0438\u0442\u0435 \u0432\u0432\u043E\u0434\u0438\u0442\u044C \u0434\u043B\u044F \u043F\u043E\u0438\u0441\u043A\u0430</div>';
      return;
    }
    var ql=q.toLowerCase();
    var results=[];
    this.idx.forEach(function(entry){
      var pos=entry.x.indexOf(ql);
      if(pos!==-1){
        var start=Math.max(0,pos-50);
        var end=Math.min(entry.x.length,pos+q.length+80);
        results.push({s:entry.s,d:entry.d,t:entry.t,ex:entry.x.slice(start,end).trim(),pos:pos});
      }
    });
    this.renderResults(results.slice(0,15),q);
  },

  renderResults(results,q){
    var el=document.getElementById('searchResults');
    if(!results.length){el.innerHTML='<div class="search-empty">\u041D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u043D\u0430\u0439\u0434\u0435\u043D\u043E</div>';return}
    var ql=q.toLowerCase();
    var self=this;
    el.innerHTML=results.map(function(r,i){
      var ex=r.ex;
      var mi=ex.indexOf(ql);
      if(mi!==-1){
        ex=self.esc(ex.slice(0,mi))+'<mark>'+self.esc(ex.slice(mi,mi+q.length))+'</mark>'+self.esc(ex.slice(mi+q.length));
      }else{ex=self.esc(ex)}
      return '<div class="search-result'+(i===0?' active':'')+'" data-i="'+i+'" onclick="app.goResult('+r.s+','+r.d+')"><div class="search-result-title">'+self.esc(r.t)+'</div><div class="search-result-excerpt">\u2026'+ex+'\u2026</div></div>';
    }).join('');
    this.searchActive=0;
  },

  esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')},

  goResult(sec,depth){
    this.closeSearch();
    if(document.getElementById('reader').classList.contains('hidden'))this.showReader();
    this.go(sec,depth>=0?depth:undefined);
  },

  handleSearchKey(e){
    if(e.key==='Escape'){e.preventDefault();this.closeSearch();return}
    var results=document.querySelectorAll('.search-result');
    if(!results.length)return;
    if(e.key==='ArrowDown'){
      e.preventDefault();
      this.searchActive=Math.min(this.searchActive+1,results.length-1);
    }else if(e.key==='ArrowUp'){
      e.preventDefault();
      this.searchActive=Math.max(this.searchActive-1,0);
    }else if(e.key==='Enter'&&this.searchActive>=0){
      e.preventDefault();results[this.searchActive].click();return;
    }else{return}
    var sa=this.searchActive;
    results.forEach(function(r,i){r.classList.toggle('active',i===sa)});
    if(results[sa])results[sa].scrollIntoView({block:'nearest'});
  },

  /* ── Scroll ── */
  handleScroll(){
    var btt=document.getElementById('btt');
    if(btt)btt.classList.toggle('vis',window.scrollY>600);
  },
  scrollTop(){window.scrollTo({top:0,behavior:'smooth'})},

  prev(){if(this.s.sec>-2)this.go(this.s.sec-1)},
  next(){if(this.s.sec<NC)this.go(this.s.sec+1)},

  /* ── Keyboard ── */
  bindKeys(){
    var self=this;
    document.addEventListener('keydown',function(e){
      /* Search shortcut */
      if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();self.openSearch();return}
      if(e.key==='Escape'){
        if(!document.getElementById('searchModal').classList.contains('hidden')){self.closeSearch();return}
        if(document.getElementById('settingsPanel').classList.contains('open')){self.closeSettings();return}
        if(self.s.sbOpen){self.closeSidebar();return}
      }
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
      if(e.key==='ArrowLeft')self.prev();
      else if(e.key==='ArrowRight')self.next();
      else if(e.key==='m'||e.key==='\u044C')self.toggleSidebar();
      else if(e.key==='h'||e.key==='\u0440')self.goHome();
      else if(e.key==='s'||e.key==='\u044B')self.toggleSettings();
    });
  }
};
app.init();
</script>
</body>
</html>
