ke=\"var(--bg)\" stroke-width=\".6\"/></g><g><title>1Ин — 5 гл.</title><rect x=\"639.2\" y=\"166\" width=\"12.7\" height=\"84\" rx=\"1.5\" fill=\"currentColor\" opacity=\"0.6\" stroke=\"var(--bg)\" stroke-width=\".6\"/></g><g><title>2Ин — 1 гл.</title><rect x=\"653.4\" y=\"178\" width=\"4.0\" height=\"72\" rx=\"1.5\" fill=\"currentColor\" opacity=\"0.6\" stroke=\"var(--bg)\" stroke-width=\".6\"/></g><g><title>3Ин — 1 гл.</title><rect x=\"658.9\" y=\"170\" width=\"4.0\" height=\"80\" rx=\"1.5\" fill=\"currentColor\" opacity=\"0.6\" stroke=\"var(--bg)\" stroke-width=\".6\"/></g><g><title>Иуд — 1 гл.</title><rect x=\"664.4\" y=\"174\" width=\"4.0\" height=\"76\" rx=\"1.5\" fill=\"currentColor\" opacity=\"0.6\" stroke=\"var(--bg)\" stroke-width=\".6\"/></g><g><title>Откр — 22 гл.</title><rect x=\"669.9\" y=\"170\" width=\"55.9\" height=\"80\" rx=\"1.5\" fill=\"currentColor\" opacity=\"0.45\" stroke=\"var(--bg)\" stroke-width=\".6\"/><text x=\"697.9\" y=\"243\" transform=\"rotate(-90 697.9 243)\" font-size=\"9.5\" fill=\"var(--bg)\" style=\"font-family:var(--fm)\" letter-spacing=\".05em\">Откр</text></g><line x1=\"12\" y1=\"251\" x2=\"728\" y2=\"251\" stroke=\"currentColor\" stroke-width=\"1.4\" opacity=\".8\"/></svg><figcaption>Вся библиотека на одной полке: толщина корешка — число глав</figcaption></figure>\n<p>Временная ось начинается с Авраама — по традиционному счёту он жил около двух тысяч лет до нашей эры — и доходит до конца первого века нашей эры, когда складывается ранняя христианская история и появляются последние тексты Нового Завета. Библия писалась веками, многими людьми, в разных землях и обстоятельствах. Но сквозь неё проходит одна дуга: творение, разлом, обещание, исполнение, горизонт. Сначала мир назван хорошим, потом человек теряет целостность и прячет лицо, затем Бог выбирает одного человека и через его потомков начинает возвращать благословение миру. Обещание становится народом, народ получает закон и землю, теряет их и снова учится ждать. В Иисусе христиане видят исполнение древнего обещания, а в конце — не исчезновение мира, а горизонт его преображения.</p>\n<p>Иногда я представляю эту временную ось не прямой линией на стене, а дорогой, которую видно с холма. Внизу блестит река, за ней пыльная полоса, дальше тёмные деревья и несколько огней. Подойдёшь ближе — и дорога снова спрячется за поворотом. Так Библия и читается: ты узнаёшь общий рельеф раньше, чем различаешь каждый камень. Один и тот же образ может вернуться через столетия, переменив голос. Вода оказывается границей, пустыня — местом испытания, гора — местом встречи, а сад в начале отзывается садом в конце. Я пока только отмечаю эти места карандашом; их смысл станет яснее, когда мы пройдём путь.</p>\n<h2 id=\"почему-в-храме-звучит-чужой-язык\">Почему в храме звучит чужой язык</h2>\n<p>Теперь можно вернуться к тому чтению, с которого мы начали. Я не понял его не потому, что в храме произносили тайные формулы и не потому, что христианство требует сначала сдать экзамен на посвящённость. В девятом веке Кирилл и Мефодий переводили богослужебные тексты для славянских народов, и постепенно сформировался церковнославянский язык богослужения. Он родствен современному русскому, но сохраняет старые формы слов, обороты и звучание. Для тех, кто к нему привык, он несёт ритм молитвы; для новичка сначала может быть похож на знакомую песню, слова которой забыты.</p>\n<p>Церковнославянский — язык богослужения, а не тайный код. Его присутствие напоминает, что храм живёт не только сегодняшним днём: в нём слышен голос поколений, которые молились до нас. Но если ты пока не различаешь этот голос, стыдиться нечего. Смысл можно искать в русском переводе, читать параллельно, спрашивать, возвращаться к одному месту несколько раз. В домашней библиотеке чаще всего встречается Синодальный перевод, подготовленный и изданный в тысяча восемьсот семьдесят шестом году. Он тоже не отменяет трудностей древнего текста, зато даёт вход в него на языке, которым ты живёшь.</p>\n<aside class=\"minute\"><span class=\"minute-tag\">минута в сторону</span><p>Привычные «главы и стихи» — поздняя разметка. На главы Библию поделил парижский профессор Стефан Лэнгтон около 1205 года, а стихи пронумеровал печатник Робер Этьенн в 1551-м — по семейному преданию, он размечал текст в дороге, на остановках. Сами авторы писали сплошным письмом, без номеров. Так что «глава третья, стих шестнадцатый» — не голос древнего автора, а удобные засечки на полях очень длинной дороги.</p></aside>\n<p>Русский перевод тоже имеет свою дистанцию от сегодняшней речи. Некоторые обороты звучат торжественно, некоторые слова успели изменить оттенок, а привычная фраза может оказаться старше нескольких поколений. Это похоже на старую фотографию: лицо видно, но вокруг него стоит другой свет. Мне не нужно делать вид, будто старина сама по себе гарантирует истину; достаточно честно различать непривычность формы и трудность содержания. Встреча с древним текстом требует терпения, но терпение не равно бездумному почтению.</p>\n<p>Я хорошо помню разницу между тем, как книга лежит закрытой, и тем, как она звучит вслух. На полке она похожа на тяжёлый прямоугольник с тонкой пылью на верхнем обрезе. Откроешь — страницы шуршат, бумага пахнет клеем, пальцы находят плотный шов переплёта. В храме тот же текст выходит из рук и становится воздухом: один человек читает, другие слушают, кто-то теряет строку, кто-то узнаёт её сразу. Для меня это долго было неудобно. Я хотел сначала всё понять, а потом уже входить. Библия, как и разговор, часто делает наоборот: понимание приходит по мере пребывания внутри речи.</p>\n<p>Поэтому сама «Карта» устроена как несколько последовательных шагов, а не как словарь незнакомых имён. Сначала будет сад — место начала, дара и первой трещины. Затем исход — путь из рабства к свободе и цена, которую свободный человек учится платить. Потом цари и пророки: время надежды, власти, падения, изгнания и голоса, который не даёт обещанию умереть. После этого появится Иисус, вокруг Которого сходятся древние линии. Затем начнётся дорога в Рим — путь учеников, который выносит весть из Иерусалима к другим народам. Шестой шаг — сердце учения: что именно христианство говорит о Боге, человеке, зле, смерти, любви и надежде.</p>\n<p>Эту дорогу можно пройти подряд за пару вечеров, если не требовать от себя сразу запомнить каждое имя. Я буду оставлять тебе остановки, знакомые очертания и несколько повторяющихся ориентиров. Позже главы книги разберут спорные места, проверят основания и задержатся там, где одного пересказа мало. Здесь же мы стоим у входа в библиотеку, ещё не выдавая себя за знатока. Я открываю первую дверь и вижу свет, падающий на траву, воду, деревья и человека, который ещё не знает, что скоро ему придётся выбирать.</p>\n<p>За первой дверью карты уже виден сад — место, где сама история впервые открывает глаза.</p>"},{"num":2,"short":"Сад","title":"Сад","yadro":"","obzor":"","polnaya":"<p>На первой странице Библии ещё нет ни одной человеческой тени. Только тьма над бездной, вода, над которой движется дыхание, и голос, после которого в темноте загорается свет. «Да будет свет» — не рабочая команда в пустой мастерской, а первое слово в большой поэме. Свет отделяется от тьмы, вода получает границу, суша выходит из моря, трава и деревья начинают расти, светила отмечают времена, а потом в живое пространство входят птицы, рыбы и звери. Мир возникает не как склад деталей, а как место, где чему-то можно быть.</p>\n<p>Каждый день похож на строфу. В конце снова звучит: «И увидел Бог, что это хорошо». В последний день взгляд задерживается на всём сразу: «весьма хорошо». Это первая интонация Библии, и её легко не расслышать за последующими катастрофами. Материя здесь не ошибка и не тюрьма для духа. Вода хороша, земля хороша, тело будущего человека тоже должно быть хорошим. Даже время не брошено в пустоту: оно получает ритм труда и покоя.</p>\n<p>Если читать эту страницу не торопясь, мир здесь похож на дом, в котором зажигают свет комнату за комнатой. Сначала виден только потолок, потом пол, потом окно, за окном — сад, а в саду уже есть место для голоса, шага и дыхания. Ничто не появляется как мусор, случайно забытый после работы. Даже то, что мы привыкли считать бессловесным, получает свою меру и своё место. Отсюда христианское недоверие к мысли, будто дух надо спасать от материи: сама материя в начале истории принята, названа доброй и включена в благодарность.</p>\n<p>Шесть строф заканчиваются седьмой, в которой Бог почивает. Его покой — знак полноты: творение достигло своего порядка и теперь может просто быть перед своим Творцом. Это не протокол лаборатории. Это поэма о том, кто дал миру начало и зачем дал ему быть. Жанр этой страницы говорит прежде всего о «кто и зачем», оставляя вопрос о точном способе и порядке научному исследованию. Мне важно удержать здесь простую вещь: то, что существует, изначально показано как дар.</p>\n<h2 id=\"сад\">Сад</h2>\n<p>Потом в поэме появляется человек. Бог помещает его в сад, где уже есть вода, деревья, тень и пища, и поручает ему «возделывать его и хранить его». Сад — не гостиничный номер, в котором можно жить, ничего не делая, и не парк за высоким забором. Это доверенное место, а человек в нём одновременно садовник и хранитель. Ему даны руки, речь, способность давать имена животным, узнавать другого и отвечать за то, что ему доверено.</p>\n<p>Человек назван образом Божиим. В этом названии нет намёка на внешнее сходство, словно Бог имеет человеческое лицо и рост. Речь о способности отражать Творца в мире: видеть смысл, творить, заботиться, вступать в отношения, отвечать за собственный выбор. К тому, почему это достоинство не исчезает даже под слоями стыда и жестокости, книга ещё вернётся в главе «Образ Божий».</p>\n<p>В саду есть свобода, и рядом с ней — одно дерево, к которому нельзя прикасаться. Границы мало, но она настоящая. Любовь, в которой невозможно отказать, похожа на исправно работающий механизм, а не на любовь. Поэтому человеку дано не только «можно», но и возможность сказать «нет». В этом месте Библия не устраивает длинного объяснения свободы; она показывает её как тихое условие близости.</p>\n<p>Дальше события ускоряются. Змей говорит с женщиной, плод оказывается в руке, затем человек ест. Они видят свою наготу, пытаются спрятаться, слышат Божий зов, и сад, бывший домом, становится местом, откуда их выводят. Я намеренно оставляю падение в этих коротких движениях: змей, плод, стыд, изгнание. Подробный разбор слов змея, самой подтасовки и последующих разрывов ждёт тебя в главе «Грехопадение».</p>\n<p>Но уже здесь в рассказе появляется тонкая нить, которую нельзя потерять. В словах о вражде между змеем и женщиной, о её семени, которое поразит змея, впервые звучит обещание победы над тем, что вошло в сад. Пока это только слово, почти незаметное на фоне приговора и закрытых ворот. Но вся дальнейшая история будет тянуть эту нить через людей, семьи, плен и смерть.</p>\n<p>За воротами сада первая кровь проливается почти сразу. Каин и Авель приносят Богу свои дары, и Каин не выдерживает, что дар брата принят иначе. Они выходят в поле, где нет стен и свидетелей, кроме земли. Каин убивает Авеля, а когда Бог спрашивает о брате, отвечает: «разве я сторож брату моему?» Вопрос звучит как отговорка, но в нём уже спрятан весь холод человеческой истории: чужая жизнь объявляется чужой заботой.</p>\n<p>Зло растёт не одним прыжком. Оно переходит от зависти к насилию, от насилия к хвастовству насилием, от частного преступления к общей привычке. В родословиях между именами возникают ремесла, города, музыка, оружие; жизнь не исчезает, люди продолжают строить и петь. Но вместе с умением делать мир удобнее растёт способность делать другому больно. Вскоре земля, которая должна была принять семя и хлеб, оказывается наполненной жестокостью.</p>\n<p>После рассказа о первых братьях Библия надолго задерживается на именах. Для современного читателя родословие может выглядеть как коридор с одинаковыми дверями, но в нём есть свой ритм: один человек рождает другого, годы складываются в поколения, память переносится дальше, чем способен прожить отдельный человек. Между убийством в поле и появлением Ноя лежит не пустота, а множество обычных дней. Люди выращивали хлеб, женились, спорили, рожали детей, хоронили родителей. Именно в такой повседневности и созревает большая беда: зло становится не исключением, а воздухом, которым дышит весь дом.</p>\n<h2 id=\"вода-и-имя\">Вода и имя</h2>\n<p>В этой точке появляется Ной. Бог велит ему построить ковчег, и Ной строит его среди сухой земли, пока окружающие живут так, будто порядок вещей никогда не изменится. Ковчег не похож на корабль для завоеваний: он не плывёт к цели, а сохраняет жизнь, доверенную ему посреди воды. Когда начинается потоп, вода накрывает знакомый мир. Это рассказ о растворении творения обратно в хаос, о том, как границы между небом, морем и сушей на время исчезают.</p>\n<p>Внутри ковчега тесно, шумно и пахнет животными. Дождь стучит по крыше, снаружи не видно ни дороги, ни края земли. У Ноя нет карты, по которой можно узнать, сколько ещё продлится путь. Он может только ждать и держаться за слово. Когда вода отступает, первой выходит не победная армия, а птица, возвращающаяся с зелёной веткой. Мир снова показывает, что жизнь может начаться с малого знака.</p>\n<p>Тогда Бог заключает с Ноем завет. Это слово означает не красивое обещание на память, а связь, которой Бог Сам себя связывает. Он помещает радугу в облако, словно вешает на небо лук войны, повернув оружие к мирной стороне, и обещает не уничтожать землю потопом. Небо после грозы становится не просто красивым: оно хранит знак обещания. Человечество ещё будет нарушать свои обещания, но первый завет уже держится не на человеческой стойкости.</p>\n<aside class=\"minute\"><span class=\"minute-tag\">минута в сторону</span><p>В 1872 году в Британском музее Джордж Смит разбирал клинописную табличку из Ниневии и понял, что читает вавилонский рассказ о великом потопе — одиннадцатую песнь эпоса о Гильгамеше. По воспоминаниям очевидцев, он вскочил и от волнения начал срывать с себя одежду. Древний Ближний Восток помнил большую воду по-своему; Библия говорит о потопе не в пустоте, а в разговоре и споре со своими соседями.</p></aside>\n<p>После воды люди снова собираются вместе и решают построить город с башней до неба, чтобы сделать себе имя и не рассеяться по земле. Вавилонская башня — их попытка самим закрепить себя в мире, который они боятся потерять. Бог смешивает их речь, и строители перестают понимать друг друга. История не говорит, что всякое строительство плохо. Она показывает другое: единство, превращённое в средство самопрославления, быстро становится хрупким. Камни поднимаются вверх, а разговор распадается.</p>\n<aside class=\"minute\"><span class=\"minute-tag\">минута в сторону</span><p>За рассказом о башне стоит вполне земная архитектура — зиккураты, ступенчатые храмовые башни Междуречья. Руины самого известного, Этеменанки, «дома основания неба и земли» в Вавилоне, археологи раскопали в начале двадцатого века; многие видят в нём прообраз библейской башни. А в Уре, откуда выйдет Авраам, зиккурат стоит до сих пор — его вскрыла экспедиция Леонарда Вулли в двадцатые годы прошлого века.</p></aside>\n<p>И всё же карта не обрывается в рассеянии. Среди народов, которые разошлись по земле, Бог зовёт одного человека.</p>\n<h2 id=\"звёзды-над-палаткой\">Звёзды над палаткой</h2>\n<p>Авраам живёт в стране отцов, среди привычных богов, родственных связей и дороги, которую обычно наследуют вместе с именем. Ему приходит зов: «пойди из земли твоей». Не дана подробная схема маршрута, не назван конечный город. Сначала нужно оставить известное, а потом идти туда, куда будет указано. Авраам выходит в неизвестность не потому, что у него есть теория о будущем, а потому, что он доверился голосу.</p>\n<p>С этим зовом связаны три обещания. У него будет земля, будет потомство, и «благословятся в тебе все племена земные». Здесь впервые ясно очерчен замысел, проходящий через всю Библию: Бог выбирает один народ не для того, чтобы закрыть дверь перед остальными, а чтобы через одного прийти ко всем. Маленькая семья становится местом, через которое благословение должно разойтись шире её границ.</p>\n<p>Авраам живёт в палатке, которую можно снять и поставить снова. Это хороший образ его веры: под ногами нет окончательно закреплённого пола, но над ним есть небо. Однажды Бог выводит его наружу и предлагает посмотреть на звёзды, если он способен их сосчитать. Обещание кажется невозможным: Авраам стар, его жена Сарра бесплодна, а годы идут. Вера здесь не похожа на математическую уверенность. Это доверие к Тому, чьё слово пока не совпадает с видимым.</p>\n<p>Авраамов шатёр стоит на границе между странствием и домом. У него есть слуги, стада, очаг и место, где можно принять путника, но нет каменных стен, которые обещали бы окончательную безопасность. Он выходит встречать незнакомцев, ставит перед ними хлеб и воду, ждёт ответа на обещание, которое больше его собственной жизни. Завет растёт не только в великих минутах, но и в таких повторяющихся жестах: разжечь огонь, накормить гостя, снова свернуть шатёр, когда приходит время дороги.</p>\n<p>Сарра смеётся, услышав, что у неё будет сын. В её смехе есть усталость человека, который уже слишком давно знает пределы собственного тела. Потом рождается Исаак, и его имя означает «смех». То, что сначала звучало как неверие, становится именем радости. Библейская история умеет сохранять оба оттенка: смех недоверия и смех полученного дара.</p>\n<p>О Мории я скажу только столько, сколько нужно для этой карты. Авраам идёт с Исааком на гору, несёт огонь и нож, а сын несёт дрова. Мальчик спрашивает, где агнец, и отец отвечает, что Бог усмотрит его. На вершине рука Авраама останавливается, и вместо Исаака оказывается овен. Сцена остаётся тяжёлой и не просит лёгкого объяснения. Её богословский смысл и длинную тень, падающую от этой горы к последующим событиям, книга разберёт в главе «Ветхий Завет».</p>\n<h2 id=\"борьба-до-рассвета\">Борьба до рассвета</h2>\n<p>У Исаака рождаются Исав и Иаков. Иаков с самого начала умеет добиваться своего окольными путями: он получает право первородства, потом обманом забирает отцовское благословение и вынужден бежать от брата. На ночёвке он кладёт голову на камень и видит лестницу между землёй и небом. В этом сне Бог не отменяет его прошлого, но обещает не бросить его в дороге. Иаков просыпается уже не просто беглецом: над ним есть обещание, которое он не смог бы выторговать сам.</p>\n<p>Через годы он возвращается к земле, но перед встречей с Исавом остаётся ночью у потока Иавок. Там он борется с таинственным противником до рассвета. Утро наступает, когда борьба ещё не закончена; Иаков получает новое имя — Израиль, то есть «боровшийся с Богом». Он выходит с хромотой, потому что встреча оставляет след в теле. В этом имени нет обещания безошибочности или покорности: народ назван борющимся. Это не разрешение на упрямство, а признание: вера иногда проходит через ночь, вопросы и удерживание рядом с Богом до рассвета.</p>\n<p>У Иакова двенадцать сыновей. Из них вырастут двенадцать колен Израиля. Число пока стоит в семейной истории, но позже вернётся в другом круге — в двенадцати апостолах. Так Библия любит оставлять ранние узелки, смысл которых раскрывается далеко впереди.</p>\n<p>Самый младший из братьев, Иосиф, получает от отца особую одежду и рассказывает сны, в которых семья склоняется перед ним. Братья слышат не обещание, а угрозу. Они бросают его в яму и продают купцам, уходящим в Египет. Дома остаётся окровавленная одежда, а отец решает, что сын погиб. Иосиф становится рабом, затем попадает в тюрьму из-за чужой клеветы. Его жизнь идёт вниз, хотя сны обещали высоту.</p>\n<p>До того как братья снова увидели Иосифа, прошло много лет. В Египте он учился жить с чужим языком, чужой одеждой и чужими правилами. Днём он считал мешки зерна и распоряжался работниками, вечером слышал во дворе незнакомую речь. Его новая жизнь могла показаться окончательной, если смотреть только на ближайший день. Но библейский рассказ не торопит развязку. Он позволяет почувствовать, как обещание иногда лежит под толщей времени, пока человек занимается тем, что находится перед ним.</p>\n<p>В тюрьме Иосиф истолковывает сны, и со временем его приводят к фараону. Он предупреждает о годах изобилия и голода, получает власть над запасами зерна и становится человеком, от которого зависит спасение целой страны. Когда голод приходит, братья спускаются в Египет за хлебом и не узнают того, кого когда-то продали. Иосиф узнаёт их. У него есть власть наказать, но он выбирает раскрыться, привести семью к себе и сохранить жизнь.</p>\n<p>В этой встрече он произносит слова, ставшие первым ясным уроком промысла: «Вы умышляли против меня зло; но Бог обратил это в добро». Иосиф не называет зло добром и не делает вид, будто предательство было пустяком. Он говорит о другом: человеческая рука может вести кривую линию, а Бог способен провести через неё прямой путь, не оправдывая руку. Бог пишет прямо по кривым строчкам людей.</p>\n<p>Семья Иакова переселяется в Египет, где ей дают землю и хлеб. Чужая страна на время становится убежищем. Пожилой Иаков ещё успевает увидеть Иосифа, а потом умирает среди сыновей, которые начинали с соперничества и оказались одной большой семьёй. Дети рождаются, их становится больше, и небольшое семейство постепенно превращается в народ.</p>\n<p>Потом в Египте встаёт новый фараон, «не знавший Иосифа». Память о спасителе стирается, численность пришельцев начинает пугать власть, и приглашённые гости становятся рабочей силой. Сначала появляются надзиратели и кирпичи, затем — рабство. Обещание, данное Аврааму под открытым небом, кажется забытым под египетской пылью. Песок оседает на следах первых переселенцев, дети рабов уже не помнят земли, из которой пришли их отцы. Прошло около четырёхсот лет.</p>"},{"num":3,"short":"Исход","title":"Исход","yadro":"","obzor":"","polnaya":"<p>Тростник у Нила шевелился от самого лёгкого ветра, и вода между стеблями казалась чёрной. В этой воде лежала маленькая корзина, обмазанная смолой. Внутри плакал младенец. Его мать спрятала его там не от крокодилов и не от ночного холода: фараон приказал бросать в реку каждого новорождённого мальчика из народа Израиля. Женщина не могла отменить указ, но могла выиграть несколько часов и доверить ребёнка воде. Рядом, притаившись в камышах, следила его старшая сестра Мириам.</p>\n<p>Корзину нашла дочь фараона. Она услышала плач, догадалась, чей это ребёнок, и всё-таки велела оставить его себе. Мириам подошла и предложила найти кормилицу; так мать получила возможность кормить собственного сына, пока тот не подрос. Потом мальчик оказался во дворце и получил имя Моисей, связанное с водой. В этой первой сцене уже спрятана странная насмешка над властью: указ фараона должен был уничтожить будущего соперника, а вместо этого будущий освободитель вырос под крышей поработителя, среди его слуг, языков и каменных стен. Я возвращаюсь к этой корзине, когда думаю о том, как Библия начинает большие перемены с вещи, которую почти никто не замечает: с детского плача в камышах. Если ты читаешь эти страницы впервые, именно здесь стоит задержать взгляд: освобождение начинается с жизни, которую власть уже сочла расходным материалом.</p>\n<h2 id=\"имя-в-огне\">Имя в огне</h2>\n<p>Моисей вырос египтянином по воспитанию и евреем по происхождению. Однажды он увидел, как надсмотрщик избивает раба-еврея, и убил его. Он спрятал тело в песке, но тайна быстро вышла наружу. Фараон захотел убить Моисея, и тот бежал из Египта в землю Мадиамскую. В следующей части его жизни нет дворцового блеска: он пасёт овец, женится, привыкает к тишине и проводит так около сорока лет. Человек, который когда-то действовал резко и один, становится старым пастухом на краю чужой страны.</p>\n<p>Во дворце Моисей учился смотреть на мир глазами тех, кто распоряжался чужими жизнями. Он видел порядок, который держался на страхе, и, вероятно, долго не знал, где в нём находится сам. Когда позже он узнает, что принадлежит к народу рабов, это знание не принесёт ему спокойствия. Оно расколет его жизнь надвое: дворец останется за спиной, но привычка к дворцовому языку и власти не исчезнет сразу. Поэтому его первый самостоятельный поступок оказывается таким резким, а годы с овцами — таким необходимым. Освободить народ должен человек, которому предстоит сначала выйти из собственной путаницы.</p>\n<p>Потом на склоне горы он видит куст, который горит и не сгорает. Моисей подходит, и голос говорит ему снять обувь: место свято. Бог поручает ему вернуться к фараону и вывести рабский народ. Моисей отвечает всеми способами, какие находит испуганный человек: кто я такой, почему мне поверят, что я скажу, если меня спросят имя? В ответ звучит: «Я есмь Сущий». К этому имени книга ещё вернётся в главе «Почему вообще что-то есть».</p>\n<p>Моисей отпирается до конца: он косноязычен, речь его тяжела, он не годится для переговоров и публичного вождества. Тогда Бог даёт ему в помощь брата Аарона, который будет говорить за него. В этом выборе есть рефрен всей Библии, который я всякий раз слышу с новой силой: Бог выбирает негодных. Не самых гладких, быстрых и убедительных, а человека с убийством в прошлом, страхом в настоящем и слабым голосом. Моисей не превращается в безупречного героя; он просто идёт, потому что его послали.</p>\n<p>Фараон не отпускает рабов. Казни приходят одна за другой, и я не буду превращать их в каталог чудес: вода и земля, свет и тьма, жизнь и смерть становятся сценой поединка с богами Египта. В каждом ударе слышится вызов порядку, который считал фараона почти божеством. Но фараон упрямится, то обещая свободу, то отказываясь от обещания. У власти есть особая слепота: она может увидеть разрушение вокруг себя и всё равно принять уступку за поражение.</p>\n<h2 id=\"ночь-когда-прошли-мимо\">Ночь, когда прошли мимо</h2>\n<p>Последняя казнь касается первенцев. Израильским семьям велено взять агнца, приготовить его к ночной трапезе и помазать его кровью косяки дверей. За дверью, отмеченной кровью, смерть должна пройти мимо. Отсюда и название праздника: Пасха, от древнего слова, означающего «пройти мимо». Люди едят поспешно, с опоясанными станами, обувью на ногах и посохом в руке, потому что ночь освобождения уже началась.</p>\n<p class=\"thread-p\"><span class=\"thread\"><i></i>нить: агнец</span>Здесь история сжимается в знак, который потом прошьёт всю Библию. Агнец, кровь на дверях и переход от рабства к свободе станут языком, на котором будут говорить пророки и Евангелия. Через много веков Иоанн Креститель увидит Иисуса и скажет: «Вот Агнец Божий». В евангельском рассказе Христос будет распят именно в пасхальные дни, и христианин читает эту близость не как случайную деталь календаря. Я не пытаюсь сейчас доказать её значение: достаточно увидеть, как один ночной образ продолжает идти через всю историю, пока не остановится у креста.</p>\n<p>Фараон наконец отпускает народ, но вскоре меняет решение. Колесницы догоняют беглецов у моря. Впереди вода, сзади войско, вокруг крики людей, которые ещё вчера были рабами и пока не научились думать как свободные. Моисей простирает руку, воды расступаются, и Израиль проходит по суше. Когда египтяне бросаются следом, море возвращается на своё место. После этого Мириам берёт тимпан, за ней выходят женщины, и лагерь отвечает песней. У спасённых появляется голос, прежде чем у них появится закон.</p>\n<p>Порядок здесь имеет значение. Бог не сказал: исполните закон, и тогда Я выведу вас. Он вывел их, когда они были испуганы, зависимы и ничего не могли предъявить в свою защиту, а уже потом привёл к горе и дал заповеди. Сначала спасение, потом требования; сначала дар, потом ответ. Вся христианская речь о благодати снова и снова возвращается к этому порядку: человек не покупает освобождение правильным поведением, а учится жить свободным после того, как его вывели. Если ты привык измерять веру прежде всего требованиями, этот порядок легко перевернуть в голове; здесь его стоит оставить именно таким, каким он дан в рассказе.</p>\n<h2 id=\"гора-и-шатёр\">Гора и шатёр</h2>\n<p>От моря дорога ведёт к Синаю. Гора окутана дымом, громом и облаком, народ стоит внизу, а Моисей поднимается навстречу Богу. Там заключается завет. Это слово означает связь, в которую стороны входят всерьёз: Израиль становится народом Бога, а Бог обещает быть его Богом. Образ напоминает брак: клятва соединяет не два безупречных существа, а двух участников, которым предстоит учиться верности.</p>\n<p>Десять заповедей вмещают весь этот союз в короткий рисунок. Первая скрижаль обращена к Богу: не иметь иных богов, не делать себе идолов, не произносить имени всуе и хранить день покоя; речь идёт о том, кому принадлежит сердце народа и как эта принадлежность выражается в жизни. Вторая обращена к ближнему: чтить отца и мать, не убивать, не прелюбодействовать, не красть, не лжесвидетельствовать и не желать чужого; свобода одного человека заканчивается там, где начинается разрушение другого.</p>\n<p>И почти сразу завет получает страшную проверку. Пока Моисей на горе, люди требуют видимого бога и отливают золотого тельца. Изображение ещё не остыло, а народ уже празднует вокруг него. Это измена прямо в день свадьбы, причём измена тому, кто только что вывел их из дома рабства. Моисей разбивает скрижали, ходатайствует за народ, возвращается на гору. Бог обличает измену, но не расторгает союз: завет обновляется, скрижали получают продолжение, а путь продолжается. В этом есть больше терпения, чем позволяет человеческая логика договора.</p>\n<aside class=\"minute\"><span class=\"minute-tag\">минута в сторону</span><p>У горы, которую предание отождествляет с Синаем, с шестого века стоит монастырь святой Екатерины — один из древнейших непрерывно действующих монастырей мира. В его библиотеке в девятнадцатом веке нашли Синайский кодекс: греческую Библию четвёртого века, старейший полный Новый Завет. Место, где Моисею открылось Имя, полторы тысячи лет хранило ещё и Книгу.</p></aside>\n<p>После горы возникает шатёр собрания, скиния. Его ставят посреди лагеря, и это важная перемена в пространстве: Бог хочет быть в центре повседневной жизни народа, среди палаток, детей, дыма от очагов и споров, а не только на вершине, куда поднимается один посредник. Вокруг скинии устанавливается жертвенный порядок. Кровь становится языком серьёзности разрыва: жизнь отдана, потому что разрыв с источником жизни нельзя изобразить лёгким жестом; позже этот язык получит окончательное прочтение в кресте.</p>\n<p>Вокруг шатра жизнь не становится безоблачной. Утром люди разбирают палатки, вечером ставят их снова; облако над скинией показывает время остановки и путь дальше. Дети растут внутри этой перемены, старики устают, спорщики мирятся или расходятся, и всё это происходит рядом со святилищем. Святость здесь оказывается не бегством от грязной дороги, а присутствием посреди неё. Для меня это один из самых земных образов книги: Бог не убирает лагерь и не заменяет его небом, а входит в пыль, где люди учатся жить вместе.</p>\n<p>Здесь честно назвать книгу Левит. Именно на этих страницах гибнут читатели, начавшие читать Библию с первой страницы подряд: слишком много деталей о жертвах, очищении и священниках, слишком мало привычного сюжета. Это нормально. При первом чтении Левит можно обойти, сохранив в голове главное: Бог посреди народа, святость как образ жизни и жертва как знак восстановленной связи. Когда карта уже сложилась, к этим страницам легче вернуться.</p>\n<h2 id=\"пустыня-без-карты\">Пустыня без карты</h2>\n<p>До земли обещания остаётся долгий путь. Пустыня проверяет людей сильнее, чем море. В море они боялись умереть сразу, а в пустыне им приходится просыпаться каждый день и заново доверять. Утром на земле лежит манна, похожая на тонкие хлопья. Её собирают столько, сколько нужно на день; запас, сделанный из жадности, портится. Хлеб на один день превращает доверие из красивого слова в ежедневную практику. Позднее молитва скажет: «Хлеб наш насущный подавай нам на сей день», и в этой просьбе слышится пустынный опыт Израиля.</p>\n<p>Народ ропщет из-за воды, пищи, дороги и страха перед жителями земли. Освобождение произошло быстро, но привычка рабов уходит медленно. Люди, которые привыкли, что за них решают, пугаются собственной ответственности и начинают вспоминать Египет как место с мясом и котлами. Так должно смениться поколение: те, кто родился рабом, постепенно уходят, а их дети учатся входить в землю как свободные. Я не читаю эти сорок лет как лишнюю петлю сюжета. Это время, в котором тело вышло из рабства раньше сердца.</p>\n<p>Сам Моисей до земли не доходит. На горе Нево он видит её издали: долины, реки, очертания будущего дома. Потом умирает. В этой смерти нет удобной награды за службу, нет сцены, где старый вождь торжественно вступает в исполнение обещания. Есть человек, которому позволено увидеть цель, но не взять её в руки. Его дело продолжается через Иисуса Навина.</p>\n<p>Имя Иисуса Навина звучит для христианского уха знакомо не случайно. Это то же имя, что Иисус: обычное еврейское имя со смыслом «Господь спасает». Оно не было редким титулом и само по себе ничего не доказывало; просто два человека с одним именем оказываются в разных поворотах одной истории. Иисус Навин ведёт народ через Иордан, занимает землю и распределяет её между коленами. Тёмные страницы этих войн, где звучат приказы об истреблении, я не стану сглаживать: их тяжесть и возможные пути чтения книга разбирает в главе «Ветхий Завет».</p>\n<aside class=\"minute\"><span class=\"minute-tag\">минута в сторону</span><p>Древнейшее бесспорное упоминание Израиля вне Библии — египетское, и оно из этой же эпохи. На гранитной стеле фараона Мернептаха, высеченной около 1208 года до нашей эры, среди побеждённых народов Ханаана перечислен Израиль. Народ Исхода уже виден соседям — пусть пока только в списке чужих военных трофеев.</p><figure class=\"ch-illust artifact\"><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Merenptah%20Israel%20Stele%20Cairo.jpg?width=1200\" alt=\"Мернептахова стела, около 1208 года до нашей эры. Каир\" loading=\"lazy\"><figcaption>Мернептахова стела, около 1208 года до нашей эры. Каир</figcaption></figure></aside>\n<p>После смерти Иисуса Навина начинается время судей. Судья здесь не только человек, который решает споры, но временный избавитель и вождь. Схема повторяется почти как дыхание, сбившееся в боль: народ отступает, приходит беда, люди вопиют, Бог поднимает избавителя, враг отступает, а после смерти избавителя всё начинается снова. Девора, Гедеон, Самсон появляются короткими вспышками рассказа; у каждого есть мужество и трещина, и ни один не становится окончательным ответом.</p>\n<p>Чем дальше, тем гуще становится беспорядок. Избавление не превращается в устойчивую верность, потому что каждый следующий круг начинается с той же внутренней свободы без общего центра. Книга Судей заканчивается фразой, которая звучит одновременно как диагноз и как приоткрытая дверь: «В те дни не было царя у Израиля; каждый делал то, что ему казалось справедливым». За этой фразой уже слышны шаги будущих царей — и новая глава истории, где народ попробует найти единство в человеке, сидящем на престоле.</p>"},{"num":4,"short":"Цари и пророки","title":"Цари и пророки","yadro":"","obzor":"","polnaya":"<p>Самуил уже состарился. Волосы побелели, голос стал тише, а ноги, наверное, помнили больше дорог, чем хотелось вспоминать. Он сидел в Раме, когда к нему пришли старейшины Израиля. За их спинами стоял народ, уставший от переменчивых судей и набегов соседей. Просьба звучала разумно: поставь над нами царя, чтобы он судил нас, как у прочих народов.</p>\n<p>Самуилу это было неприятно. Он молился, и Бог ответил ему словами, в которых слышится не только утешение пророку, но и диагноз целому народу: «Не тебя они отвергли, но отвергли Меня, чтоб Я не царствовал над ними». Израиль просил видимого правителя. Ему хотелось иметь лицо, знамя, дворец и войско, чтобы смотреть на соседей и не чувствовать себя странным народом, у которого вместо царя — невидимый Бог. Бог позволил им получить желаемое, но заранее предупредил о цене: царь возьмёт сыновей на войну, дочерей на службу, поля и стада на содержание двора.</p>\n<p>Но просьба о царе не была странной сама по себе. В Законе уже есть место для будущего правителя, и царская власть могла стать служением. Трещина была в другом: народ хотел царя «как у прочих народов», будто видимое сходство с соседями важнее невидимой верности. Он просил не только порядка, но и гарантии, что больше не придётся жить на доверии. Мне знакомо это желание: заменить трудную зависимость от Бога чем-то, что можно увидеть, измерить и поставить под охрану.</p>\n<h2 id=\"царь-по-желанию\">Царь по желанию</h2>\n<p>Первым стал Саул, человек, которого легко представить среди толпы: высокий, красивый, заметный на голову выше остальных. В нём было обещание — не пустое. Он умел вести за собой, был способен на смелость и в начале своего пути выглядел именно тем царём, которого просили. Но власть быстро показывает, из чего сделано сердце. Саул начал беречь не волю Бога, а собственное положение. Он торопился принести жертву, нарушал поручение, оправдывал непослушание красивыми словами и всё больше зависел от того, как выглядит перед людьми.</p>\n<p>Потом рядом появился Давид, и народ запел, что Саул победил тысячи, а Давид — десятки тысяч. Зависть вошла в царский дом и стала сильнее благодарности. Саул ещё мог остановиться, но постепенно власть сделала его человеком, который видит в спасителе соперника, а в каждом голосе — угрозу. Его падение не случилось одним ударом. Он ломался о маленькие уступки страху, о желание понравиться, о привычку удерживать трон любой ценой.</p>\n<p>Мне важно не превращать Саула в картонного злодея. Так история была бы удобнее, но беднее. В нём видно то, что может произойти с каждым, кто получил ответственность и незаметно начал считать её своей собственностью. Царь, который должен был служить народу, стал охранять себя от народа. Обещающий человек оказался пленником собственного имени.</p>\n<p>После этого Саул ещё долго преследовал Давида по горам. Тот прятался в пещерах, а однажды оказался рядом с царём и мог убить его, но отказался поднять руку на помазанника. В этой паузе между властью и местью Давид уже был царём по внутреннему жесту, хотя корона ещё оставалась у Саула. Он умел ждать, тогда как Саул всё сильнее торопился удержать то, что ему было дано.</p>\n<h2 id=\"пастух-и-престол\">Пастух и престол</h2>\n<p>Давид появляется совсем иначе. Он младший в семье, пастух, которого даже не позвали на первую встречу с пророком Самуилом: отец перечислил сыновей, а Давид остался в поле с овцами. Когда Бог выбирает его, старшие удивляются. В этом повторяется один из главных ритмов библейской истории: Бог выбирает тех, на кого люди не поставили бы. Младшего вместо старшего, слабого вместо вооружённого, незаметного вместо представительного. Рефрен будет возвращаться снова и снова.</p>\n<p>Самая известная сцена его юности происходит в долине, где две армии стоят друг против друга и никто не решается сделать шаг. Из рядов филистимлян выходит Голиаф. Он огромен, закован в броню, вооружён и уверен, что страх уже выиграл сражение за него. Израильтяне смотрят на него снизу вверх и каждый день возвращаются в лагерь с тем же молчанием. Давид приходит туда не как воин, а как мальчик с хлебом для братьев и поручением от отца.</p>\n<p>Он слышит вызов, который остальные уже привыкли не слышать. Давид не спорит с размером великана и не делает вид, будто опасности нет. Он отказывается от царских доспехов: чужая броня мешает двигаться тому, кто никогда её не носил. В руке у него праща, рядом ручей и пять гладких камней. Голиаф видит перед собой мальчика и смеётся. Давид подходит ближе, раскручивает пращу, и камень попадает в единственное место, которое не закрыто железом. Великан падает лицом вниз. В этой сцене запоминается не только победа слабого над сильным. Запоминается разница между тем, что видит толпа, и тем, на что смотрит Бог.</p>\n<p>Сцена работает и как рассказ о смелости, и как рассказ о внимании. Пока все смотрят на рост Голиафа, Давид замечает, что перед ним живой человек, а не непобедимая статуя. Пока остальные считают дни поражения, он слышит, что имя Бога унижают. Я не знаю, как именно выглядел тот камень и сколько времени заняла схватка; текст оставляет детали простыми, чтобы в памяти остался не боевой приём, а встреча доверия со страхом.</p>\n<p>Позже Давид станет царём и будет далеко не безупречен. Но прежде он станет поэтом. Псалтирь — молитвенник Библии, книга, в которой человеческая речь проходит весь диапазон: от ярости и обиды до благодарности и ликования. Там можно сказать Богу, что враги слишком близко, что сердце не выдерживает, что ночь не кончается. Можно спорить, плакать, вспоминать, благодарить и снова просить. Молитва не обязана выглядеть благополучной, чтобы быть настоящей. Я возвращался к псалмам именно за этим разрешением говорить без лака; к такой молитве книга ещё вернётся в главе «Молитва».</p>\n<p>С Давидом связано и обещание, которое раздвинуло горизонт всей дальнейшей истории. Бог говорит ему, что его дом и царство будут утверждены навеки. Речь идёт не просто о политической династии. Отсюда рождается ожидание Царя-Помазанника. Слово «Мессия» означает «помазанник»: того, кого помазали елеем и поставили на царское служение. Постепенно надежда на такого царя станет надеждой на Того, кто восстановит народ, победит зло и вернёт миру правильный порядок.</p>\n<p>Но тот же Давид, которого народ помнит как певца и победителя Голиафа, однажды увидел Вирсавию, пожелал её, устроил гибель её мужа Урии и попытался спрятать преступление под царской властью. Пророк Нафан пришёл к нему с притчей о богаче, отнявшем у бедняка единственную овечку, а затем сказал прямо: «Ты — тот человек». Библия не щадит своих героев. Она сохраняет их песни и их грязь, победы и падения, не вырезая неудобные страницы ради почтительного портрета. В ответ Давид не смог отмахнуться от обвинения. Пятидесятый псалом — плод этого падения: «Помилуй меня, Боже, по великой милости Твоей». Это голос царя, который понял, что корона не делает его невиновным.</p>\n<aside class=\"minute\"><span class=\"minute-tag\">минута в сторону</span><p>Долго можно было считать Давида фигурой из одних преданий. В 1993 году на раскопках в Тель-Дане нашли обломок арамейской стелы девятого века до нашей эры: враг Иудеи хвалится победой над царём из «дома Давида». Это первое внебиблейское свидетельство самой династии — от соседа и противника, которому незачем льстить.</p><figure class=\"ch-illust artifact\"><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/JRSLM%20300116%20Tel%20Dan%20Stele%2001.jpg?width=1200\" alt=\"Стела из Тель-Дана, IX век до нашей эры: «дом Давида»\" loading=\"lazy\"><figcaption>Стела из Тель-Дана, IX век до нашей эры: «дом Давида»</figcaption></figure></aside>\n<p>Соломон, сын Давида, получил от Бога мудрость и стал символом царского расцвета. При нём Израиль обрёл богатство, влияние и храм в Иерусалиме. Храм был местом встречи, не жилищем Бога в человеческом смысле. Внутри него Святое святых обозначало одну точку на земле, куда первосвященник входил с трепетом: знак того, что бесконечный Бог Сам назначил место Своего присутствия среди конечного народа.</p>\n<p>С именем Соломона связаны книги мудрости: Притчи, Екклесиаст, с которым ты уже встречался в главе «Три часа ночи», и Песнь Песней. В них есть практическая трезвость, усталость от пустоты, красота любви и попытка понять жизнь, когда простые ответы не выдерживают. Но Соломон тоже не удержал сердце. Союзы, богатство и чужие культы постепенно увели его от единства с Богом. Самый мудрый человек в царстве оказался способен сделать самый обычный человеческий шаг в сторону: решить, что ему можно немного отступить от верности.</p>\n<p>При храме возникал целый ритм жизни: жертвы, праздники, пение, работа священников и паломничество к Иерусалиму. Для человека из далёкой деревни дорога туда была долгой и пыльной, но в конце её ждали стены, над которыми поднимался дым жертвенника. Так вера получала не только слова, но и место, запах, календарь и лица. В этом была сила храма, поэтому его будущая потеря окажется для народа не сменой здания, а обрывом привычного мира.</p>\n<p>После Соломона царство раскололось. Север стал называться Израилем, юг — Иудеей. На севере установились свои центры поклонения и своя линия царей, на юге остались Иерусалим и храм. Политическая трещина быстро стала духовной: один народ начал жить как два, и оба постепенно учились оправдывать собственную неверность.</p>\n<h2 id=\"голоса-над-царями\">Голоса над царями</h2>\n<p>В этот момент особенно ясно видно, зачем нужны пророки. Пророк — не гадатель, который сообщает расписание будущих событий. Это голос Бога, обращённый к совести народа здесь и сейчас. Пророк входит во дворец без приглашения, называет царя виновным, защищает вдову и сироту, напоминает о чужаке и говорит, что обряд без милости превращается в пустой звук. Он мешает власти считать себя последней инстанцией.</p>\n<p>Илия на горе Кармил в сжатом виде показывает эту смелость: один человек против двора, жрецов и общей привычки. А после огня и шума приходит веяние тихого ветра. Я не буду пересказывать здесь его кризис — он подробно разобран в главе «Депрессия и тревога», где важнее другое: даже великий пророк остаётся человеком, которому бывает страшно и пусто.</p>\n<p>Осия получил от Бога странное и болезненное поручение: его семейная история стала образом неверности Израиля. Бог показан как преданный муж, который не бросает изменившую жену, но выкупает её из рабства. В этой картине нет дешёвой сентиментальности. Верность оказывается трудной, унизительной и дорогой, потому что любимый человек действительно ушёл.</p>\n<p>Амос говорил от имени тех, кого обычно не слышали. Его правосудие должно течь, как вода, а правда — как сильный поток. Для пророка недостаточно принести правильную жертву, если рядом бедняк, которого закон оставил без защиты. Религиозная жизнь проверяется не громкостью песнопения, а тем, что происходит с человеком, у которого нет власти.</p>\n<p>Исайя видел небесный храм и слышал пение серафимов: «Свят, Свят, Свят Господь Саваоф! вся земля полна славы Его!» Ему же принадлежат песни о Страдающем Рабе: «Он был презрен и умален пред людьми, муж скорбей и изведавший болезни». Для христиан эти строки позже станут частью портрета Иисуса, но датировка и разные способы чтения Исайи требуют отдельного разговора; книга вернётся к ним в главе «Ветхий Завет».</p>\n<p>Иеремия был плачущим пророком. Он любил свой город и видел, как тот идёт к разрушению, поэтому его слова звучали не как холодный прогноз, а как боль человека, который не может перестать предупреждать близких. И среди этой боли он передал обещание: наступят дни, когда Бог заключит с домом Израиля и с домом Иуды «новый завет». Закон будет помещён внутрь человека и написан на его сердце. Словосочетание «Новый Завет» родилось здесь, примерно за шесть веков до Тайной вечери. В тот момент оно было ещё обещанием, ожидающим исполнения.</p>\n<h2 id=\"плен-и-ожидание\">Плен и ожидание</h2>\n<p>Северное царство не выдержало давления Ассирии. Около 722 года до нашей эры Самария была взята, население рассеяно, и Израиль исчез как самостоятельное царство. Южная Иудея продержалась дольше, но около 586 года до нашей эры вавилонское войско разрушило Иерусалим и храм. Людей увели в плен, а место, где Бог обещал встречаться с народом, осталось грудой камней.</p>\n<p>«При реках Вавилона, там сидели мы и плакали, когда вспоминали о Сионе». Эта строка стала голосом плена. Вера теперь должна была жить без царя, без земли и без храма. В чужой стране люди собирались для молитвы и чтения Писаний; из таких собраний вырастет синагога. Начинается собирание, переписывание и объяснение священных текстов. Народ, лишённый привычных опор, учится носить святыню в памяти и слове.</p>\n<p>Плен изменил и сам способ читать историю. До него можно было думать, что народ держится землёй, царской линией и стенами. После него стало ясно, что обещание не совпадает с политическим успехом: Иерусалим лежит в развалинах, а Бог всё ещё слышит молитву у чужой реки. В субботу, в дни праздников и в долгих чтениях люди заново собирали рассыпавшуюся память. Писание стало переносимым домом, который можно было открыть там, где настоящего дома больше нет.</p>\n<p>Иезекииль увидел поле сухих костей, над которыми прошёл Дух Божий, и кости ожили. Видение говорило о возвращении Израиля, но образ оказался шире одной политической надежды: Бог способен вернуть жизнь туда, где человек видит только окончание. Даниил увидел фигуру «как бы Сына человеческого», которому дана власть над народами. Этот титул останется в Писании и однажды станет тем, которым Иисус будет называть Себя.</p>\n<p>Персидский царь Кир разрешил пленникам вернуться. Началось восстановление Иерусалима и храма. Второй храм был скромнее первого, и старики, помнившие прежний, плакали, пока молодые радовались новым стенам. Ездра возвращал народу Закон, Неемия поднимал городские стены и собирал рассеянных. Последним голосом пророческой эпохи звучит Малахия, а затем наступает тишина примерно на четыре столетия.</p>\n<aside class=\"minute\"><span class=\"minute-tag\">минута в сторону</span><p>Указ Кира — не только библейский сюжет. В Британском музее лежит глиняный цилиндр, исписанный клинописью около 539 года до нашей эры: Кир рассказывает, как вернул переселённые народы в их города и восстановил их святилища. Иудея в тексте не названа, но политика узнаваема — та самая, благодаря которой пленники с рек Вавилона снова увидели Иерусалим.</p><figure class=\"ch-illust artifact\"><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Cyrus%20Cylinder%2C%20Babylon%2C%20Iraq%2C%20mid%20500s%20BC%2C%20cuneiform%20on%20clay%20-%20British%20Museum%20-%20DSC01316.jpg?width=1200\" alt=\"Цилиндр Кира, около 539 года до нашей эры. Британский музей\" loading=\"lazy\"><figcaption>Цилиндр Кира, около 539 года до нашей эры. Британский музей</figcaption></figure></aside>\n<p>Тишина, однако, не означала, что история остановилась. Александр Македонский принёс эллинизм, и Библия заговорила по-гречески в переводе, который называют Септуагинтой. Маккавеи восстали против насильственного навязывания чужой культуры и очистили храм. Затем пришёл Рим: Помпей вошёл в Иерусалим около 63 года до нашей эры, а позднее власть над Иудеей получил Ирод, царь, поставленный Римом.</p>\n<p>К приходу Иисуса народ был расколот не только политикой, но и ожиданиями. Фарисеи ревностно хранили Закон и устные толкования; их нельзя сводить к карикатуре лицемеров, хотя Евангелия будут спорить с некоторыми их решениями. Саддукеи составляли храмовую аристократию и держались за порядок, который позволял им сохранять влияние.</p>\n<p>Ессеи уходили в пустыню, надеясь сохранить чистоту вдали от испорченного города. Зилоты хотели сбросить римское ярмо оружием, иногда пряча нож под одеждой. Мытари собирали налоги для оккупантов и потому считались предателями; некоторые из них наживались на своих же соседях. На этом фоне слово «Мессия» звучало почти как искра в сухой траве. Многие ждали царя-освободителя с мечом, который разобьёт Рим и вернёт Израилю славу Давида.</p><figure class=\"graphic g-timeline\"><svg viewBox=\"0 0 640 1200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Синхронная лента: события Библии и мировой истории\"><line x1=\"320\" y1=\"32\" x2=\"320\" y2=\"1164\" stroke=\"currentColor\" stroke-width=\"1.2\" opacity=\".7\"/><line x1=\"315\" y1=\"105.35483870967741\" x2=\"325\" y2=\"105.35483870967741\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"320\" y=\"98.35483870967741\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">2500</text><line x1=\"315\" y1=\"303.2043010752688\" x2=\"325\" y2=\"303.2043010752688\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"320\" y=\"296.2043010752688\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">2000</text><line x1=\"315\" y1=\"501.0537634408602\" x2=\"325\" y2=\"501.0537634408602\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"320\" y=\"494.0537634408602\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">1500</text><line x1=\"315\" y1=\"698.9032258064516\" x2=\"325\" y2=\"698.9032258064516\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"320\" y=\"691.9032258064516\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">1000</text><line x1=\"315\" y1=\"896.752688172043\" x2=\"325\" y2=\"896.752688172043\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"320\" y=\"889.752688172043\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">500</text><line x1=\"315\" y1=\"1094.6021505376343\" x2=\"325\" y2=\"1094.6021505376343\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"320\" y=\"1087.6021505376343\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">Р.Х.</text><text x=\"296\" y=\"24\" text-anchor=\"end\" font-size=\"12\" fill=\"var(--tx3)\" style=\"font-family:var(--fm)\" letter-spacing=\".14em\">БИБЛИЯ</text><text x=\"344\" y=\"24\" font-size=\"12\" fill=\"var(--tx3)\" style=\"font-family:var(--fm)\" letter-spacing=\".14em\">МИР</text><line x1=\"304\" y1=\"303.2043010752688\" x2=\"320\" y2=\"303.2043010752688\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".5\"/><circle cx=\"304\" cy=\"303.2043010752688\" r=\"3\" fill=\"currentColor\"/><text x=\"294\" y=\"306.7043010752688\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Авраам выходит из Ура</text><text x=\"294\" y=\"320.2043010752688\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">по традиционному счёту</text><line x1=\"304\" y1=\"599.9784946236559\" x2=\"320\" y2=\"599.9784946236559\" stro olor\" stroke-width=\".7\" opacity=\".5\"/><circle cx=\"304\" cy=\"886.7225806451613\" r=\"3\" fill=\"currentColor\"/><text x=\"294\" y=\"890.2225806451613\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Возвращение из плена</text><line x1=\"304\" y1=\"924.4516129032259\" x2=\"320\" y2=\"924.4516129032259\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".5\"/><circle cx=\"304\" cy=\"924.4516129032259\" r=\"3\" fill=\"currentColor\"/><text x=\"294\" y=\"927.9516129032259\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Малахия — и четыре века тишины</text><line x1=\"304\" y1=\"1029.3118279569892\" x2=\"320\" y2=\"1029.3118279569892\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".5\"/><circle cx=\"304\" cy=\"1029.3118279569892\" r=\"3\" fill=\"currentColor\"/><text x=\"294\" y=\"1032.8118279569892\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Восстание Маккавеев</text><line x1=\"304\" y1=\"1093.0193548387097\" x2=\"320\" y2=\"1093.0193548387097\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".5\"/><circle cx=\"304\" cy=\"1093.0193548387097\" r=\"3\" fill=\"currentColor\"/><text x=\"294\" y=\"1096.5193548387097\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Рождество</text><text x=\"294\" y=\"1110.0193548387097\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">счёт эры сдвинут на несколько лет</text><line x1=\"304\" y1=\"1117.0193548387097\" x2=\"320\" y2=\"1106.47311827957\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".5\"/><circle cx=\"304\" cy=\"1117.0193548387097\" r=\"3\" fill=\"currentColor\"/><text x=\"294\" y=\"1120.5193548387097\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Крест и пустой гроб</text><line x1=\"304\" y1=\"1141.0193548387097\" x2=\"320\" y2=\"1116.365  fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><text x=\"346\" y=\"623.263440860215\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Троянская война</text><text x=\"346\" y=\"636.763440860215\" font-size=\"9.5\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">по преданию</text><line x1=\"320\" y1=\"796.6408602150537\" x2=\"336\" y2=\"796.6408602150537\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".5\"/><circle cx=\"336\" cy=\"796.6408602150537\" r=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><text x=\"346\" y=\"800.1408602150537\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Основание Рима</text><text x=\"346\" y=\"813.6408602150537\" font-size=\"9.5\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">легендарная дата</text><line x1=\"320\" y1=\"809.6989247311828\" x2=\"336\" y2=\"820.6408602150537\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".5\"/><circle cx=\"336\" cy=\"820.6408602150537\" r=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><text x=\"346\" y=\"824.1408602150537\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Гомер складывает поэмы</text><text x=\"346\" y=\"837.6408602150537\" font-size=\"9.5\" fill=\"var(--tx4)\" style=\"font-family:var(--fm)\">около</text><line x1=\"320\" y1=\"896.752688172043\" x2=\"336\" y2=\"896.752688172043\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".5\"/><circle cx=\"336\" cy=\"896.752688172043\" r=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><text x=\"346\" y=\"900.252688172043\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Конфуций учит в Китае</text><line x1=\"320\" y1=\"904.6666666666666\" x2=\"336\" y2=\"920.752688172043\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".5\"/><circle cx=\"336\" cy=\"920.752688172043\" r=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><text x=\"346\" y=\"924. ntColor\" stroke-width=\"1.2\"/><text x=\"346\" y=\"1097.1731182795697\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Убийство Цезаря</text><line x1=\"320\" y1=\"1125.8623655913977\" x2=\"336\" y2=\"1125.8623655913977\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".5\"/><circle cx=\"336\" cy=\"1125.8623655913977\" r=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><text x=\"346\" y=\"1129.3623655913977\" font-size=\"12.5\" fill=\"var(--tx)\" style=\"font-family:var(--fb)\">Везувий хоронит Помпеи</text></svg><figcaption>Библия и мир: два потока одного времени</figcaption></figure>\n<p>И вот в этой накалённой тишине, между римскими дорогами, храмовой политикой и ожиданием вооружённого царя, была галилейская деревня Назарет. Туда вошёл вестник к девушке, которую история почти не замечала, и сказал: «Радуйся, Благодатная! Господь с Тобою». За дверью остались каменные улицы, долгие века плена и молчания; внутри началось слово, которого ждали цари, пророки и целый народ.</p>"},{"num":5,"short":"Иисус из Назарета","title":"Иисус из Назарета","yadro":"","obzor":"","polnaya":"<p>Ночью в Вифлееме было холодно. Город, набитый приезжими из-за переписи, пах не свечами и свежим сеном, а потом, пылью и навозом. Иосиф пришёл сюда из Назарета с Марией: имперский приказ требовал, чтобы каждый записался в городе своего рода. Для Рима это была строка в ведомости, ещё один способ пересчитать людей и налоги. Для них это была длинная дорога, усталость и беременная женщина, которой негде было лечь.</p>\n<p>Ребёнок родился не во дворце и не в чистой комнате. Его положили в ясли, в кормушку для скота. Так начинается рассказ о человеке, которому позже поклонятся цари и перед которым будут молчать толпы. Пока рядом были только животные, скрип двери и простая ткань. Пастухи, ночевавшие в поле, услышали весть первыми. В тогдашнем обществе это был низший, почти невидимый класс: люди, которым доверяли стада, но не свидетельство. Они пришли, нашли младенца и ушли, рассказывая всем, что видели.</p>\n<p>В этом эпизоде нет открыточной сладости. Здесь окраина империи, холод, грязь и люди, у которых ничего не было, кроме дороги. И всё же именно сюда, по евангельскому рассказу, вошёл Бог. Волхвы с востока пришли позже, ведомые звездой. Ирод услышал о царе и испугался за свой трон. Семья ненадолго бежала в Египет, а после смерти Ирода вернулась и поселилась в Назарете. Этот тёмный отрезок рассказа я оставлю коротким: дальше важнее не то, как власть охотится за ребёнком, а то, как ребёнок вырастает среди обычных людей.</p>\n<p>Перепись связывала человека с родом, но для самого Иосифа важнее была дорога. Из Назарета до Вифлеема приходилось идти несколько дней, через холмы и пыльные тропы. Мария ехала, вероятно, на осле или шла рядом; евангелист не рисует подробностей, и потому легко забыть, что ожидание ребёнка не отменяет тяжести пути. Ночь в городе была похожа на многие ночи в истории бедных: кто-то уступил угол, кто-то принёс воду, кто-то просто закрыл дверь.</p>\n<p>Пастухи сначала испугались не содержания вести, а внезапного света посреди поля. Им сказали, что родился Спаситель, Христос Господь, и дали примету: младенца найдут лежащим в яслях. Примета была странной именно своей простотой. Дворец обозначили бы стражей, богатство — блеском, власть — приказом. Здесь знаком оказался ребёнок, которого можно было найти среди кормушек.</p>\n<aside class=\"minute\"><span class=\"minute-tag\">минута в сторону</span><p>Наш календарь считает годы от этого рождения, но сам счёт появился поздно: в шестом веке монах Дионисий Малый предложил вести летоисчисление «от Воплощения Господня» — и, как выяснилось позже, ошибся года на четыре-шесть. Ирод умер к четвёртому году до нашей эры, так что Иисус, по странной иронии хронологии, родился за несколько лет «до нашей эры». Ошибка монаха навсегда осталась в наших датах.</p></aside>\n<h2 id=\"тридцать-лет-тишины\">Тридцать лет тишины</h2>\n<p>Назарет был маленьким селением, о котором не складывали больших ожиданий. Там Иисус прожил почти всю первую часть жизни. Он работал руками, знал вес дерева и камня, видел, как люди строят, чинят, устают и возвращаются домой. Евангелия не заполняют эти годы догадками. В них почти ничего не сказано о детстве, и эта тишина сама по себе выразительна: прежде чем заговорить перед тысячами, Он десятилетиями жил без публичного имени.</p>\n<p>Днём Назарет жил звуками ремесла: стучали молотки, скрипели телеги, женщины звали детей с улицы, из домов тянулся дым. По субботам люди сходились в синагоге, слышали чтение Закона и пророков, обсуждали новости из Иерусалима. Иисус знал эту жизнь изнутри. Он не пришёл к людям с небесной высоты, где их привычки казались бы ему мелкими. Он вырос в тех же разговорах, долгах, семейных заботах и ожидании урожая.</p>\n<p>Тридцать лет почти незаметного труда не были пустым промежутком между чудом рождения и проповедью. В них помещалась обычная верность: проснуться, сделать работу, помочь дому, пойти в синагогу, похоронить близкого, встретить соседа. Евангелие не говорит, что именно из этих дней вошло в каждую будущую притчу. Но когда Иисус потом говорил о потерянной монете, тесте, винограднике и хозяине дома, Он говорил языком людей, среди которых жил.</p>\n<p>Единственная подробная сцена детства происходит, когда Ему было двенадцать. На праздник семья пришла в Иерусалим, а на обратной дороге родители обнаружили, что мальчика нет среди паломников. Три дня они искали Его и нашли в храме среди учителей: Он слушал их и задавал вопросы. На тревожный упрёк матери Иисус ответил: «Мне должно быть в том, что принадлежит Отцу Моему». Потом Он вернулся с ними в Назарет и оставался им послушен. Небесное в этом рассказе не отменяет домашних обязанностей.</p>\n<p>Когда Иисус вышел к людям, впереди уже стоял Иоанн Креститель. Он жил в пустыне, носил одежду из верблюжьей шерсти, питался тем, что можно было найти в безлюдной местности, и говорил резко: «Покайтесь». Это было не приглашение к лёгкому улучшению характера. Иоанн требовал повернуть жизнь обратно к Богу, пока ещё есть время. К нему стекались люди, исповедовали грехи и входили в воды Иордана.</p>\n<p>Иоанн не обещал слушателям комфортного будущего. К нему приходили самые разные люди: простые жители, сборщики налогов, воины. Одних он учил довольствоваться жалованьем и не вымогать, другим напоминал о честности, всем говорил делиться с теми, у кого нет одежды и пищи. Пустыня становилась местом, где привычные звания теряли силу. Перед водой Иордана царь, солдат и должник стояли одинаково открытыми.</p>\n<p class=\"thread-p\"><span class=\"thread\"><i></i>нить: агнец</span>Иисус пришёл к Иоанну и тоже вошёл в реку. Иоанн не понимал, зачем Ему это крещение, но Иисус настоял. После выхода из воды небо открылось, и над Ним явился Дух Божий; голос назвал Его возлюбленным Сыном. Я не буду здесь разворачивать смысл этой сцены: к Иордану книга вернётся в главе «Троица». Иоанн увидел в Иисусе того, о ком говорил: «Вот Агнец Божий, Который берет на Себя грех мира». Длинная стрелка от пасхального агнца Исхода теперь указывала на человека.</p>\n<p>Сразу после этого Иисус оказался в пустыне. Он постился сорок дней и остался один среди камней, ветра и голода. Искушения здесь важны не как странный эпизод перед началом проповеди, а как черновик трёх дорог, которыми Он мог бы стать удобным мессией.</p>\n<p>Сначала искуситель предложил превратить камни в хлеб. Голод был настоящим, и чудо само по себе казалось безупречным. Но речь шла о чуде для Себя: использовать силу, чтобы немедленно снять собственную боль и сделать из власти над миром личную печь. Иисус ответил словами Писания: «Не хлебом одним будет жить человек, но всяким словом, исходящим из уст Божиих».</p>\n<p>Потом Он оказался на крыле храма. Искуситель предложил броситься вниз: если Иисус действительно Сын Божий, ангелы подхватят Его, а толпа увидит зрелище, которому невозможно не поверить. Это был путь громкого доказательства, управление верой через эффектный риск. Иисус не стал превращать Отца в страховочную сеть и снова ответил Писанием: «Не искушай Господа Бога твоего».</p>\n<p>Наконец перед Ним будто раскрылись царства мира с их силой, порядком и славой. Всё это можно было получить ценой одного поклона. Мессия мог бы захватить власть теми же средствами, что и всякая империя, только с религиозным знаменем. Иисус отверг и эту сделку: «Господу Богу твоему поклоняйся и Ему одному служи». После пустыни стало ясно, каким Мессией Он не будет: хлебным чудотворцем для собственного удобства, героем зрелища и правителем, покупающим царство поклонением злу.</p>\n<p>В трёх ответах Иисуса слышны три отказа от короткого пути. Он не использует Свою близость к Богу для личной выгоды, не заставляет Бога подтверждать Себя опасным спектаклем и не принимает власть из рук того, кому нельзя поклоняться. При этом Он не отрицает ни хлеб, ни чудо, ни царскую власть как таковые. Он отвергает их превращение в замену послушанию. Поэтому дальше, когда Он будет кормить голодных и исцелять больных, эти дела не станут рекламой Его силы.</p>\n<p>Он вернулся в Галилею и начал говорить: «Исполнилось время и приблизилось Царствие Божие: покайтесь и веруйте в Евангелие». Царство в Его словах было не территорией на карте и не только обещанием рая после смерти. Это власть Бога, входящая в нынешний мир уже сейчас: она возвращает человеку целостность, ставит последних рядом с первыми, освобождает от зла и учит жить в согласии с волей Царя.</p>\n<p>Для людей Галилеи «Царство» сразу звучало политически. Они жили под римским сапогом, платили налоги, видели солдат и помнили о неудачных восстаниях. Многие ждали вождя, который соберёт армию и восстановит древнюю славу. Иисус говорил о царстве, но начинал с покаяния, прощения и исцеления. В Его присутствии власть Бога проявлялась там, где человек снова мог встать, назвать правду о себе и вернуться к соседу.</p>\n<p>Это Царство уже пришло и всё ещё ожидается. Уже сейчас в нём слышны слова прощения, чужой становится братом, голодный получает хлеб, а сильный учится служить. Но мир остаётся раненым, смерть ещё не исчезла, и ученики продолжают просить: «Да приидет Царствие Твое». В этой двойной перспективе проходит вся евангельская история.</p>\n<p>У моря Он позвал рыбаков Симона и Андрея, потом Иакова и Иоанна. Они оставили сети и пошли за Ним. Вскоре к ним присоединился Левий, сборщик налогов, человек, которого соотечественники считали служащим чужой власти и наживающимся на своих. Среди двенадцати оказался и Симон, связанный с движением, мечтавшим вытеснить римлян. Рыбаки, мытарь и зилот сели за один стол, хотя в другой обстановке могли бы смотреть друг на друга как на врагов. Число двенадцать напоминало о двенадцати коленах Израиля: Иисус собирал вокруг Себя знак нового народа. Рядом с мужчинами шли женщины, в том числе Мария Магдалина, Иоанна и Сусанна. Для той эпохи само их присутствие среди постоянных учеников было необычным.</p>\n<aside class=\"minute\"><span class=\"minute-tag\">минута в сторону</span><p>В 1986 году засуха опустила уровень Галилейского моря, и в иле у берега нашли рыбацкую лодку первого века: восемь метров на два с небольшим, латаная-перелатаная из дюжины пород дерева — хозяева чинили её до последнего. В такой умещалось около десятка человек. Когда Евангелия говорят «и тотчас оставили лодку», речь о вещи, которую сегодня можно рассмотреть в музее у того же берега.</p><figure class=\"ch-illust artifact\"><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Ancient%20Boat%20of%20Sea%20of%20Galilee.jpg?width=1200\" alt=\"Галилейская лодка первого века. Гиносар\" loading=\"lazy\"><figcaption>Галилейская лодка первого века. Гиносар</figcaption></figure></aside>\n<p>Призвание происходило без торжественного объявления. Рыбак мог оставить сеть, потому что кто-то другой подхватит её; но оставить лодку, отца, привычную работу означало изменить весь порядок дней. Матфей, как будут называть Левия, встал из будки сбора пошлин и уже не мог вернуться к прежнему месту так, будто ничего не произошло. Иисус не собирал вокруг Себя людей одного характера. Порыв Петра, осторожность Фомы, властолюбивые споры учеников и тихая верность женщин оставались рядом.</p>\n<h2 id=\"царство-за-одним-столом\">Царство за одним столом</h2>\n<p>Однажды Иисус поднялся на гору, и вокруг Него собралась толпа. Нагорная проповедь начиналась не с обещания успеха. Счастливыми названы не те, кого общество обычно считает счастливыми: нищие духом, плачущие, кроткие, голодные и жаждущие правды, милостивые, чистые сердцем, миротворцы, гонимые за правду. Их положение не объявляется хорошим само по себе. Иисус говорит, что Бог видит тех, кого легко не заметить, и что нынешняя потеря не является последним словом о человеке.</p>\n<p>Ученики должны стать солью земли и светом мира. Свет не прячут под сосудом, соль не нужна сама себе. Дальше Иисус не отменяет Закон, а доводит его до глубины сердца. «Вы слышали, что сказано древним… а Я говорю вам»: убийство начинается с ярости, прелюбодеяние — с того, как человек смотрит, ложь — с привычки прикрывать пустые слова клятвой. Он говорит не судить другого, чтобы не оказаться судимым той же мерой, и заканчивает образом дома, который выдерживает ливень только потому, что стоит на камне. Слушать слова и исполнять их — вот основание, а не восхищаться ими на берегу.</p>\n<p>Когда Иисус говорил о примирении, Он начинал с дороги к алтарю: если брат имеет что-нибудь против тебя, сначала примирись с ним. Когда говорил о милостыне и молитве, запрещал делать из добрых дел сцену для чужих глаз. Даже пост должен был оставаться тихим, чтобы человек не превращал печальное лицо в знак собственной праведности. Царство меняло не только поступок, но и того, перед кем человек хочет выглядеть хорошим.</p>\n<p>Блаженства не были украшением речи. Они касались конкретных людей, стоявших на склоне: вдов, которым не на что жить, крестьян, потерявших землю, тех, кто оплакивал убитого, тех, кого преследовали за отказ участвовать в неправде. Когда Иисус называл их счастливыми, Он не смеялся над их бедностью и не просил назвать беду благом. Он ставил их под взгляд Отца, где человеческая оценка перестаёт быть окончательной.</p>\n<p>Когда ученики попросили научить их молиться, Иисус дал им короткую молитву. В ней рядом стоят имя Бога, хлеб на сегодняшний день, долг перед другим и просьба не остаться один на один с искушением:</p>\n<p>«Отче наш, сущий на небесах! да святится имя Твое; да приидет Царствие Твое; да будет воля Твоя и на земле, как на небе; хлеб наш насущный подавай нам на сей день; и прости нам долги наши, как и мы прощаем должникам нашим; и не введи нас в искушение, но избавь нас от лукавого. Ибо Твое есть Царство и сила и слава во веки. Аминь».</p>\n<p>Сам текст ещё вернётся в главе «Молитва». Иисус также велел любить врагов и молиться за тех, кто преследует, но разбор этой высокой и трудной планки здесь оставлю в стороне.</p>\n<p>Иисус часто обедал в домах, куда уважаемые учителя не заходили. За столом смешивались разговоры, запах хлеба и неловкость тех, кто не привык сидеть рядом. Однажды грешница вошла в дом фарисея во время трапезы, принесла сосуд с миром, омыла слезами ноги Иисуса и вытерла их волосами. Хозяин мысленно осудил и её, и Учителя. Иисус видел в её движении не повод для сплетни, а человека, который пришёл без другой защиты.</p>\n<p>Там, где одни спрашивали, достаточно ли другому его прошлого, Иисус рассказывал историю. Притча оставляла слушателя внутри комнаты, на дороге или у храмовой стены. Нельзя было спокойно поставить её рядом и перейти к следующей теме: каждый узнавал в ней собственный способ смотреть на людей.</p>\n<p>Его истории часто начинались с чужого возмущения. Люди видели, что Он ест с грешниками, и спрашивали, почему учитель садится рядом с теми, от кого приличные люди держатся подальше. Тогда Иисус рассказал о человеке, у которого было два сына.</p>\n<p>Младший сын однажды сказал отцу: «Отче! дай мне следующую мне часть имения». В этих словах слышался не обычный разговор о будущем наследстве: сын как будто говорил, что отец для него важнее всего только после смерти. Отец всё же разделил имение между детьми. Через несколько дней младший собрал всё и ушёл в дальнюю сторону. Там он быстро растратил состояние, живя без меры. Когда деньги кончились, в той стране начался голод, и сын нанялся пасти свиней. Для слушателей Иисуса это был самый дальний край унижения: человек из народа Завета оказался среди нечистых животных и завидовал их корму.</p>\n<p>В дальней стране младший сын сначала наверняка чувствовал свободу. У него были деньги, незнакомые улицы и никто, кто напоминал о прежней жизни. Но свобода, оторванная от любви, быстро стала одиночеством. Он мог покупать компанию, пока у него оставались монеты; когда кошель стал лёгким, вместе с ним исчезли и друзья. Голод сделал простым то, что раньше казалось невозможным: сын вспомнил не только богатство отца, но его доброту к последнему работнику.</p>\n<p>Тогда он пришёл в себя и вспомнил дом. У отца даже наёмники имели хлеб с избытком, а он погибал от голода. Сын решил вернуться и сказать: «Отче! я согрешил против неба и пред тобою и уже недостоин называться сыном твоим; прими меня в число наемников твоих». Он встал и пошёл. Ещё издали отец увидел его. Не дожидаясь объяснений и не сохраняя достоинства человека, который был оскорблён, отец побежал навстречу, обнял и поцеловал.</p>\n<p>Сын начал заготовленную речь, но отец не стал превращать возвращение в собеседование. Он велел слугам принести лучшую одежду, надеть на руку кольцо и дать обувь. Приказал заколоть откормленного телёнка и устроить пир: «Будем есть и веселиться! Ибо этот сын мой был мертв и ожил, пропадал и нашелся». Дом наполнился музыкой.</p>\n<p>Старший сын в это время возвращался с поля. Услышав пение, он позвал слугу и узнал, что вернулся брат. Старший рассердился и не захотел войти. Когда отец вышел к нему, тот напомнил: он много лет служил, никогда не нарушал приказа, но для него отец не заколол даже козлёнка, чтобы повеселиться с друзьями. А этот сын, расточивший имущество с блудницами, вернулся — и ему устроили праздник.</p>\n<p>Отец ответил тихо: «Сын мой! ты всегда со мною, и всё мое твое; а о том надобно было радоваться и веселиться, что брат твой сей был мертв и ожил, пропадал и нашелся». История заканчивается у двери, где старший сын ещё решает, войти ли в дом. Отец вышел к обоим: к тому, кто ушёл далеко, и к тому, кто был рядом, но остался за порогом.</p>\n<p>Старший сын тоже был потерян, хотя никуда не уезжал. Он измерял отношения с отцом трудом и наградой, хранил список послушания и считал праздник несправедливым распределением. Отец не ответил ему приказом войти. Он вышел из дома и к старшему, как раньше выбежал к младшему. В этом последнем движении остаётся вопрос без подписи: что сделает тот, кто привык быть правильным, когда милость достаётся неправильному?</p>\n<p>Другой человек спросил Иисуса: «А кто мой ближний?» Вопрос звучал как просьба очертить границу обязанности: кого именно я обязан любить, а кто остаётся за пределом? В ответ Иисус рассказал о путнике, шедшем из Иерусалима в Иерихон. На дороге его ограбили, избили и оставили едва живым. Мимо прошёл священник, увидел его и отошёл. Потом левит — человек, служивший при храме, — тоже прошёл мимо.</p>\n<p>Затем появился самарянин. Между иудеями и самарянами лежали давняя вражда, взаимное презрение и спор о том, где правильно поклоняться Богу. Самарянин был для слушателей человеком из чужой, подозрительной группы. Но он увидел раненого, сжалился, перевязал ему раны, полил их маслом и вином, посадил его на своё животное и привёз в гостиницу. Там он ухаживал за ним, а утром дал хозяину два динария и сказал: «Позаботься о нем; и если издержишь что более, я, когда возвращусь, отдам тебе».</p>\n<p>Дорога из Иерусалима в Иерихон спускалась через пустынные ущелья, где разбойникам легко было спрятаться. Случившееся с путником не было необычным. Необычным стало то, что самарянин рискнул остановиться. Он не знал раненого, не мог получить за помощь благодарность и мог опасаться, что его самого примут за сообщника. Милость заняла время, стоила денег и нарушила план поездки. У самарянина был свой путь, но он позволил чужой беде изменить его день.</p>\n<p>Иисус спросил законника, кто из троих оказался ближним попавшемуся разбойникам. Тот ответил: «Оказавший ему милость». Тогда Иисус сказал ему: «Иди, и ты поступай так же». Ближний здесь оказывается не готовой категорией, а человеком, который остановился рядом.</p>\n<p>Ещё однажды в храм вошли два человека помолиться. Фарисей стоял прямо и благодарил Бога, что он не таков, как другие: грабители, обидчики, прелюбодеи и этот мытарь. Он постился два раза в неделю и отдавал десятую часть доходов. Мытарь стоял вдали, не смел поднять глаз к небу, бил себя в грудь и говорил: «Боже! будь милостив ко мне, грешнику!» Фарисей был уважаемым и религиозно усердным, мытарь — презираемым сборщиком налогов. Иисус заключил: мытарь ушёл домой оправданным более, чем фарисей. «Всякий, возвышающий сам себя, унижен будет, а унижающий себя возвысится».</p>\n<p>В храме фарисей говорил правду о своих внешних поступках. Он постился, жертвовал, избегал многих нарушений и не был выдуманным злодеем. Его молитва ломалась в другом месте: рядом с благодарностью Богу она превращалась в сравнение с теми, кто стоял ниже. Мытарь не перечислял заслуг и не обещал быстро исправиться. Он принёс одну фразу, в которой не осталось защиты. Именно её Иисус поставил в центр рассказа.</p>\n<p>Слова о Царстве сопровождались делами. Во время переправы на озере разыгралась буря. Волны заливали лодку, а Иисус спал на корме. Ученики разбудили Его криком, и Он встал, запретил ветру и сказал морю: «Умолкни, перестань». Наступила великая тишина. Ученики смотрели друг на друга и спрашивали: «Кто же Сей, что и ветер и море повинуются Ему?»</p>\n<p>После бури ученики увидели в Иисусе не только человека, который может помочь в опасности. Их вопрос звучал почти испуганно: перед ними была сила, к
